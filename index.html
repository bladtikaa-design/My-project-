<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>
body{
margin:0;
font-family:sans-serif;
text-align:center;
background:#f0f0f0;
}
.dark{
background:#000;
color:white;
}

/* 🔍 SEARCH */
#searchBox{
position:fixed;
top:20px;
right:20px;
width:260px;
padding:10px;
border-radius:20px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
z-index:1000;
}
#searchInput{
width:100%;
padding:8px;
border:none;
border-radius:10px;
outline:none;
}
#searchResults{
margin-top:10px;
max-height:250px;
overflow:auto;
color:white;
text-align:left;
}
.searchItem{
padding:6px;
cursor:pointer;
border-bottom:1px solid rgba(255,255,255,0.2);
}
.searchItem:hover{
background:rgba(255,255,255,0.1);
}

/* подсветка найденного поста */
.highlight{
outline:3px solid yellow;
}

/* дальше ВСЁ ТВОЁ */
#animatedText{
font-size:28px;
font-weight:bold;
color:#00ff00;
animation:glow 2s infinite alternate;
}
@keyframes glow{
0%{color:#00ff00;}
50%{color:#55ff55;}
100%{color:#007700;}
}

/* (я НЕ трогал остальной CSS) */
.post{
background:white;
max-width:400px;
margin:10px auto;
padding:10px;
border-radius:12px;
position:relative;
}
.dark .post{background:#111;}
.avatar{width:40px;height:40px;border-radius:50%;cursor:pointer;}
.postimg{max-width:100%;border-radius:10px;margin-top:5px;}
</style>
</head>

<body>

<!-- 🔍 SEARCH -->
<div id="searchBox">
<input id="searchInput" placeholder="🔍 Search...">
<div id="searchResults"></div>
</div>

<!-- ТВОЙ САЙТ -->
<div id="animatedText">BLADTIK SITE OFFICIAL</div>

<div id="login">
<input id="nickname" placeholder="Nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">

<div>
<img id="myavatar" class="avatar">
<b id="user"></b>
<button onclick="theme()">🌙</button>
</div>

<br>

<input id="text" placeholder="Write post"><br><br>
<input type="file" id="photo"><br><br>

<button onclick="post()">Post</button>

<div id="posts"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
});

const db=getFirestore(app);

let username=localStorage.getItem("username");
let avatar=localStorage.getItem("avatar");

if(username) start();

window.login=function(){
username=document.getElementById("nickname").value;
let file=document.getElementById("avatarInput").files[0];
let reader=new FileReader();
reader.onload=function(){
avatar=reader.result;
localStorage.setItem("username",username);
localStorage.setItem("avatar",avatar);
start();
}
reader.readAsDataURL(file);
}

function start(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("user").innerText=username;
document.getElementById("myavatar").src=avatar;
}

window.theme=function(){
document.body.classList.toggle("dark");
}

/* пост */
window.post=function(){
let text=document.getElementById("text").value;
addDoc(collection(db,"posts"),{
user:username,
avatar:avatar,
text:text
});
}

/* 📦 кеш постов */
let allPosts=[];
let postElements={};

/* 📌 загрузка постов */
onSnapshot(collection(db,"posts"),snap=>{
allPosts=[];
postElements={};

document.getElementById("posts").innerHTML="";

snap.forEach(d=>{
let data=d.data();
let id=d.id;

allPosts.push({id,...data});

let div=document.createElement("div");
div.className="post";

div.innerHTML=`
<img class="avatar" src="${data.avatar}" onclick="openProfile('${data.user}','${data.avatar}')">
<b>${data.user}</b><br>
${data.text}
`;

document.getElementById("posts").append(div);

/* сохраняем ссылку на DOM */
postElements[id]=div;
});
});

/* 🔍 ПОИСК */
document.getElementById("searchInput").oninput=function(e){

let val=e.target.value.toLowerCase();
let res=document.getElementById("searchResults");

if(!val){
res.innerHTML="";
return;
}

res.innerHTML="";

/* 👤 профили */
let users={};

allPosts.forEach(p=>{
if(p.user.toLowerCase().includes(val)){
users[p.user]=p.avatar;
}
});

for(let u in users){
let div=document.createElement("div");
div.className="searchItem";
div.innerHTML="👤 "+u;
div.onclick=()=>openProfile(u,users[u]);
res.append(div);
}

/* 📌 посты */
allPosts.forEach(p=>{
if(p.text.toLowerCase().includes(val)){
let div=document.createElement("div");
div.className="searchItem";
div.innerHTML="📌 "+p.user+": "+p.text;

/* 🔥 клик → прокрутка */
div.onclick=()=>{
let el=postElements[p.id];
if(el){
el.scrollIntoView({behavior:"smooth"});

/* подсветка */
el.classList.add("highlight");
setTimeout(()=>el.classList.remove("highlight"),2000);
}
};

res.append(div);
}
});

}

/* чтобы не ломалось */
window.openProfile=function(u,a){
alert("Profile: "+u);
}

</script>

</body>
</html>
