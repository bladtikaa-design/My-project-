<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:sans-serif;
overflow-x:hidden;
}

/* космос фон */

#stars{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
overflow:hidden;
}

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:starMove linear infinite;
}

@keyframes starMove{
from{transform:translateY(-10px)}
to{transform:translateY(100vh)}
}

/* профиль */

#profile{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
padding:30px;
box-sizing:border-box;
display:none;
}

#close{
position:absolute;
right:30px;
top:20px;
font-size:30px;
cursor:pointer;
}

#topProfile{
display:flex;
align-items:center;
gap:20px;
}

#avatar{
width:110px;
height:110px;
border-radius:50%;
border:3px solid white;
}

#nick{
font-size:40px;
font-weight:bold;
}

#subs{
opacity:0.7;
}

/* кнопка subscribe космос */

#subscribe{
margin-left:auto;
border:none;
border-radius:40px;
padding:12px 25px;
font-size:18px;
cursor:pointer;
color:white;
position:relative;
overflow:hidden;
background:black;
border:2px solid white;
}

#subscribeStars{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

.subStar{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:subMove linear infinite;
}

@keyframes subMove{
from{transform:translateY(-5px)}
to{transform:translateY(40px)}
}

#dm{
margin-left:10px;
background:#222;
color:white;
border:none;
border-radius:40px;
padding:12px 20px;
cursor:pointer;
}

/* посты */

#posts{
margin-top:40px;
display:flex;
flex-direction:column;
gap:30px;
}

.post{
border:2px solid white;
border-radius:25px;
padding:20px;
min-height:120px;
}

</style>

</head>

<body>

<div id="stars"></div>

<div id="profile">

<div id="close" onclick="closeProfile()">✖</div>

<div id="topProfile">

<img id="avatar">

<div>

<div id="nick">NICK</div>

<div id="subs">Subscribers: <span id="subCount">0</span></div>

</div>

<button id="subscribe">
Subscribe
<div id="subscribeStars"></div>
</button>

<button id="dm">💬 DM MESSAGE</button>

</div>

<div id="posts"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* звезды фон */

for(let i=0;i<150;i++){

let star=document.createElement("div");
star.className="star";

star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";

star.style.animationDuration=(3+Math.random()*5)+"s";

document.getElementById("stars").appendChild(star);

}

/* звезды кнопки */

for(let i=0;i<25;i++){

let star=document.createElement("div");
star.className="subStar";

star.style.left=Math.random()*100+"%";
star.style.animationDuration=(2+Math.random()*3)+"s";

document.getElementById("subscribeStars").appendChild(star);

}

let currentUser="User1";
let openUser="User2";

/* открыть профиль */

window.openProfile=async function(user,avatar){

openUser=user;

document.getElementById("profile").style.display="block";
document.getElementById("nick").innerText=user;
document.getElementById("avatar").src=avatar;

loadPosts(user);
loadSubs(user);

}

/* закрыть */

window.closeProfile=function(){
document.getElementById("profile").style.display="none";
}

/* подписка */

document.getElementById("subscribe").onclick=async()=>{

const q=query(
collection(db,"subs"),
where("from","==",currentUser),
where("to","==",openUser)
);

const snap=await getDocs(q);

if(!snap.empty){
alert("Already subscribed");
return;
}

await addDoc(collection(db,"subs"),{
from:currentUser,
to:openUser
});

loadSubs(openUser);

}

/* загрузка подписчиков */

async function loadSubs(user){

let count=0;

const snap=await getDocs(collection(db,"subs"));

snap.forEach(doc=>{
if(doc.data().to==user) count++;
});

document.getElementById("subCount").innerText=count;

}

/* загрузка постов */

async function loadPosts(user){

let posts=document.getElementById("posts");
posts.innerHTML="";

const snap=await getDocs(collection(db,"posts"));

snap.forEach(doc=>{

let d=doc.data();

if(d.user==user){

let div=document.createElement("div");
div.className="post";
div.innerText=d.text;

posts.appendChild(div);

}

});

}

</script>

</body>
</html>
