<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>
/* ВСЁ ТВОЁ ОСТАВЛЕНО */

/* 🧸 NFT анимация */
@keyframes bearMove{
0%{transform:translateY(0)}
50%{transform:translateY(-6px)}
100%{transform:translateY(0)}
}

.nftBear{
font-size:40px;
animation:bearMove 1s infinite;
}
</style>
</head>

<body>

<!-- ВСЁ ТВОЁ ОСТАВЛЕНО БЕЗ ИЗМЕНЕНИЙ -->

<!-- 🎁 КНОПКА -->
<div id="giftButton" onclick="openGift()" style="
position:fixed;
bottom:90px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
cursor:pointer;
z-index:999;
">
🎁
</div>

<!-- 🛒 SHOP -->
<div id="giftBox" style="
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:black;
color:white;
padding:20px;
border-radius:20px;
z-index:999;
text-align:center;
">

<h2>🎁 NFT SHOP</h2>
<div id="balanceText"></div>

<br>

<div onclick="buyBear()" style="cursor:pointer;font-size:40px;">
🧸
</div>
<div>Animated NFT Bear - 100⚡</div>

<br>
<button onclick="closeGift()">Close</button>

</div>

<script type="module">

/* ⚡ ВАЖНЫЙ ФИКС БАЛАНСА */
let balance = localStorage.getItem("balance");

/* если вообще нет — даем 100 */
if(balance === null){
    balance = 100;
    localStorage.setItem("balance", balance);
}else{
    balance = parseInt(balance); // если 0 → останется 0
}

let hasBear = localStorage.getItem("bear") === "true";

/* открыть магазин */
window.openGift = () => {
    document.getElementById("giftBox").style.display = "block";
    document.getElementById("balanceText").innerText = "Your balance: " + balance + "⚡";
}

/* закрыть */
window.closeGift = () => {
    document.getElementById("giftBox").style.display = "none";
}

/* покупка */
window.buyBear = () => {
    if(hasBear){
        alert("You already have 🧸");
        return;
    }

    if(balance < 100){
        alert("Not enough ⚡");
        return;
    }

    balance -= 100;
    hasBear = true;

    localStorage.setItem("balance", balance);
    localStorage.setItem("bear", "true");

    alert("You buy 🧸");
    closeGift();
}

/* 👇 ДОБАВКА В ПРОФИЛЬ (НЕ ЛОМАЕТ ТВОЙ КОД) */
const oldOpenProfile = window.openProfile;

window.openProfile = async function(user,av){
    await oldOpenProfile(user,av);

    // удалить старый NFT если есть
    let old = document.getElementById("nftBox");
    if(old) old.remove();

    // если есть мишка
    if(localStorage.getItem("bear") === "true"){
        let nft = document.createElement("div");
        nft.id = "nftBox";
        nft.className = "nftBear";
        nft.innerText = "NFT 🧸";

        document.getElementById("profilePosts").prepend(nft);
    }
}

</script>

</body>
</html>
