<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>My Social + AI</title>
<style>
body { font-family:sans-serif; background:#f0f0f0; text-align:center; margin:0; }
#top { background:white; padding:10px; }
.post { background:white; margin:10px auto; padding:10px; border-radius:10px; max-width:400px; }
#aiChat { position:fixed; bottom:20px; right:20px; width:320px; background:#222; color:white; border-radius:10px; padding:10px; z-index:5000; display:none; }
#aiMessages { height:200px; overflow-y:auto; background:#111; padding:5px; margin:5px 0; border-radius:5px; }
input, button { padding:5px; border-radius:5px; border:none; margin:2px; }
.dark { background:#111; color:white; }
.dark .post { background:#1e1e1e; }
</style>
</head>
<body>

<div id="top">
  <b>My Social</b>
  <button onclick="theme()">🌙</button>
  <button onclick="openAI()">🤖 AI</button>
</div>

<h3>Posts</h3>
<input id="postText" placeholder="Напиши что-нибудь">
<button onclick="addPost()">Post</button>
<div id="posts"></div>

<!-- AI Chat -->
<div id="aiChat">
  <b>🤖 AI Bot</b>
  <div id="aiMessages"></div>
  <input id="aiInput" placeholder="Сообщение">
  <button onclick="sendAI()">Send</button>
  <button onclick="closeAI()">✖</button>
</div>

<script>
let username = prompt("Введите ник:", "Guest") || "Guest";

// ======== Посты ========
function savePosts(posts){ localStorage.setItem("posts", JSON.stringify(posts)); }
function loadPosts(){
  let posts = JSON.parse(localStorage.getItem("posts")||"[]");
  document.getElementById("posts").innerHTML = "";
  posts.forEach(text => {
    let div = document.createElement("div");
    div.className = "post";
    div.innerText = text;
    document.getElementById("posts").prepend(div);
  });
  return posts;
}
function addPost(){
  let text = document.getElementById("postText").value.trim();
  if(!text) return;
  let posts = loadPosts();
  posts.push(text);
  savePosts(posts);
  loadPosts();
  document.getElementById("postText").value = "";
}
loadPosts();

// ======== Тема ========
function theme(){ document.body.classList.toggle("dark"); }

// ======== AI ========
function openAI(){ document.getElementById("aiChat").style.display="block"; }
function closeAI(){ document.getElementById("aiChat").style.display="none"; }

function addAI(text, side){
  let box = document.getElementById("aiMessages");
  let align = side==="user" ? "right" : "left";
  let color = side==="user" ? "#333" : "#444";
  box.innerHTML += `<div style="text-align:${align}; background:${color}; margin:3px; padding:5px; border-radius:5px;">${text}</div>`;
  box.scrollTop = box.scrollHeight;
}

async function sendAI(){
  let text = document.getElementById("aiInput").value.trim();
  if(!text) return;
  addAI(text, "user");
  document.getElementById("aiInput").value = "";

  try{
    const res = await fetch("http://localhost:3000/ai", {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify({ username, message:text })
    });
    const data = await res.json();
    addAI(data.reply, "bot");
  }catch(err){
    addAI("Ошибка соединения с AI", "bot");
  }
}
</script>

</body>
</html>
