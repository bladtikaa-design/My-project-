<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>
body{
margin:0;
font-family:sans-serif;
text-align:center;
background:#f0f0f0;
}
.dark{
background:#000;
color:white;
}
#animatedText{
font-size:28px;
font-weight:bold;
color:#00ff00;
animation:glow 2s infinite alternate;
}
@keyframes glow{
0%{color:#00ff00;}
50%{color:#55ff55;}
100%{color:#007700;}
}

/* 💎 таймер */
#cooldownTimer{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
padding:12px 25px;
border-radius:30px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
color:#00ffcc;
font-weight:bold;
display:none;
z-index:999;
}

/* 🔔 DM уведомление (добавил) */
#dmNotify{
position:fixed;
top:20px;
right:20px;
padding:15px 20px;
border-radius:25px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
color:#00ffcc;
font-weight:bold;
display:none;
cursor:pointer;
z-index:2000;
}

/* 🔥 hashtags */
#hashtagsBox{
position:fixed;
top:100px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
color:white;
padding:20px;
border-radius:15px;
backdrop-filter:blur(10px);
max-width:300px;
display:none;
}
#closeTags{
position:absolute;
top:8px;
right:12px;
cursor:pointer;
font-size:18px;
}
#tagsContent{
margin-top:10px;
}

/* космос */
#stars{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}
.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:move 8s linear infinite;
}
@keyframes move{
from{transform:translateY(-10px)}
to{transform:translateY(100vh)}
}

/* пост */
.post{
background:white;
max-width:400px;
margin:10px auto;
padding:10px;
border-radius:12px;
position:relative;
}
.dark .post{
background:#111;
}
.avatar{
width:40px;
height:40px;
border-radius:50%;
cursor:pointer;
}
.postimg{
max-width:100%;
border-radius:10px;
margin-top:5px;
}
.like{
border:none;
padding:6px 12px;
border-radius:10px;
cursor:pointer;
}
.deleteBtn{
position:absolute;
top:8px;
right:8px;
background:red;
color:white;
border:none;
border-radius:10px;
padding:5px 8px;
cursor:pointer;
font-size:16px;
}

/* кнопки */
.mainBtn{
border:none;
padding:10px 15px;
border-radius:20px;
cursor:pointer;
margin:5px;
}

/* liquid glass */
#profileButton{
position:fixed;
bottom:20px;
right:20px;
width:200px;
height:60px;
border-radius:40px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
display:flex;
align-items:center;
gap:10px;
padding-left:10px;
cursor:pointer;
}
#profileButton img{
width:45px;
height:45px;
border-radius:50%;
}

/* профиль */
#profile{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:white;
display:none;
padding:20px;
overflow:auto;
}
#close{
position:absolute;
top:20px;
right:20px;
font-size:30px;
cursor:pointer;
}
#avatar{
width:100px;
height:100px;
border-radius:50%;
border:3px solid white;
}

/* чат */
#chat{
position:fixed;
bottom:0;
right:0;
width:300px;
height:350px;
background:white;
display:none;
flex-direction:column;
}
#messages{
flex:1;
overflow:auto;
color:black;
}

/* loading */
#loadingScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:1000;
}
</style>
</head>

<body>

<!-- 🔔 уведомление -->
<div id="dmNotify"><span id="dmText"></span></div>

<div id="stars"></div>
<div id="animatedText">BLADTIK SITE OFFICIAL</div>
<div id="cooldownTimer"></div>

<div id="login">
<input id="nickname" placeholder="Nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">

<div>
<img id="myavatar" class="avatar">
<b id="user"></b>
<button onclick="theme()">🌙</button>
</div>

<br>

<input id="text" placeholder="Write post"><br><br>
<input type="file" id="photo"><br><br>

<button class="mainBtn" onclick="post()">Post</button>
<button class="mainBtn" onclick="showHashtags()">🔥 Popular #</button>

<div id="posts"></div>

</div>

<div id="profileButton">
<img id="profileBtnImg">
<span>MY PROFILE</span>
<button onclick="editAvatar()">Edit</button>
</div>

<div id="profile">
<div id="close" onclick="closeProfile()">✖</div>
<img id="avatar">
<h2 id="nick"></h2>
<button id="dm">💬 DM MESSAGE</button>
<div id="profilePosts"></div>
</div>

<div id="chat">
<div id="messages"></div>
<input id="msg">
<button onclick="sendMsg()">Send</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
});
const db=getFirestore(app);

let username=localStorage.getItem("username");
let avatar=localStorage.getItem("avatar");

if(username) start();

window.login=function(){
username=document.getElementById("nickname").value;
let file=document.getElementById("avatarInput").files[0];
let r=new FileReader();
r.onload=()=>{
avatar=r.result;
localStorage.setItem("username",username);
localStorage.setItem("avatar",avatar);
start();
}
r.readAsDataURL(file);
}

function start(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("user").innerText=username;
document.getElementById("myavatar").src=avatar;
document.getElementById("profileBtnImg").src=avatar;
}

/* посты */
onSnapshot(collection(db,"posts"),snap=>{
document.getElementById("posts").innerHTML="";
snap.forEach(d=>{
let data=d.data();
let div=document.createElement("div");
div.className="post";
div.innerHTML=`
<img class="avatar" src="${data.avatar}" onclick="openProfile('${data.user}','${data.avatar}')">
<b>${data.user}</b><br>${data.text}<br>
<button onclick="like('${d.id}',${data.like})">👍 ${data.like}</button>
`;
document.getElementById("posts").append(div);
});
});

window.post=()=>{
addDoc(collection(db,"posts"),{
user:username,
avatar:avatar,
text:document.getElementById("text").value,
like:0
});
}

/* профиль */
let openUser="";
window.openProfile=(u,av)=>{
openUser=u;
document.getElementById("profile").style.display="block";
document.getElementById("nick").innerText=u;
document.getElementById("avatar").src=av;
}

/* 💬 DM система */
let currentChatUser="";

document.getElementById("dm").onclick=()=>{
currentChatUser=openUser;
document.getElementById("chat").style.display="flex";
loadMessages();
}

window.sendMsg=async()=>{
let text=document.getElementById("msg").value;
if(!text) return;

await addDoc(collection(db,"messages"),{
from:username,
to:currentChatUser,
text:text,
time:Date.now()
});

document.getElementById("msg").value="";
}

function loadMessages(){
onSnapshot(collection(db,"messages"),snap=>{
document.getElementById("messages").innerHTML="";
snap.forEach(d=>{
let m=d.data();

if(
(m.from===username && m.to===currentChatUser) ||
(m.from===currentChatUser && m.to===username)
){
let div=document.createElement("div");
div.innerText=m.from+": "+m.text;
document.getElementById("messages").append(div);
}
});
});
}

/* 🔔 уведомление */
onSnapshot(collection(db,"messages"),snap=>{
snap.docChanges().forEach(change=>{
if(change.type==="added"){
let m=change.doc.data();

if(m.to===username && m.from!==username){
let n=document.getElementById("dmNotify");
document.getElementById("dmText").innerText="Вам написал: "+m.from;

n.style.display="block";

n.onclick=()=>{
currentChatUser=m.from;
document.getElementById("chat").style.display="flex";
loadMessages();
n.style.display="none";
}

setTimeout(()=>n.style.display="none",5000);
}
}
});
});

</script>

</body>
</html>
