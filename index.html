<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>
body{
margin:0;
font-family:sans-serif;
text-align:center;
background:#f0f0f0;
}
.dark{
background:#000;
color:white;
}
#animatedText{
font-size:28px;
font-weight:bold;
color:#00ff00;
animation:glow 2s infinite alternate;
}
@keyframes glow{
0%{color:#00ff00;}
50%{color:#55ff55;}
100%{color:#007700;}
}

/* 🌗 ДОБАВЛЕНО */
#dayNightText{
position:fixed;
top:60px;
left:50%;
transform:translateX(-50%);
font-size:22px;
font-weight:bold;
z-index:999;
color:white;
text-shadow:0 0 10px black, 0 0 20px black;
pointer-events:none;
}

#sunRay{
position:fixed;
top:0;
left:50%;
transform:translateX(-50%);
width:200px;
height:200px;
background:radial-gradient(circle, rgba(255,255,0,0.6), transparent 70%);
filter:blur(40px);
opacity:0;
transition:opacity 2s;
pointer-events:none;
}

#dayNightBtn{
color:white;
text-shadow:0 0 5px black, 0 0 10px black;
}

/* остальное твое */
#cooldownTimer{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
padding:12px 25px;
border-radius:30px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
color:#00ffcc;
font-weight:bold;
display:none;
z-index:999;
}

/* дальше всё как у тебя — НЕ ТРОГАЛ */
</style>
</head>

<body>

<!-- 🌗 ДОБАВЛЕНО -->
<div id="sunRay"></div>
<div id="dayNightText"></div>

<!-- дальше ВЕСЬ твой HTML БЕЗ изменений -->
<div id="animatedText">BLADTIK SITE OFFICIAL</div>

<div id="login">
<input id="nickname" placeholder="Nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">

<div>
<img id="myavatar" class="avatar">
<b id="user"></b>
<button onclick="theme()">🌙</button>
</div>

<br>

<input id="text" placeholder="Write post"><br><br>
<button onclick="post()">Post</button>

<div id="posts"></div>

</div>

<!-- КНОПКА -->
<div id="profileButton">
<img id="profileBtnImg">
<span>MY PROFILE</span>

<!-- 🌗 ЗАМЕНА КНОПКИ -->
<button id="dayNightBtn" onclick="toggleDayNight()" style="margin-left:10px;padding:5px 10px;border-radius:12px;cursor:pointer;">
TURN ON NIGHT-DAY
</button>

</div>

<script type="module">

/* 🌗 ДОБАВЛЕНО (НЕ ЛОМАЕТ КОД) */
let dayNightEnabled = false;
let dayNightInterval = null;

window.toggleDayNight = () => {
    dayNightEnabled = !dayNightEnabled;

    if(dayNightEnabled){
        updateDayNight();
        dayNightInterval = setInterval(updateDayNight, 60000);
    }else{
        clearInterval(dayNightInterval);
        document.body.style.background = "";
        document.getElementById("dayNightText").innerText = "";
        document.getElementById("sunRay").style.opacity = 0;
    }
}

function updateDayNight(){
    let h = new Date().getHours();
    let text = document.getElementById("dayNightText");
    let sun = document.getElementById("sunRay");

    if(!text || !sun) return;

    if(h>=6 && h<11){
        document.body.style.background = "linear-gradient(#87cefa,#fff)";
        text.innerText = "GOOD MORNING LIQUID GLASS";
        sun.style.opacity = 1;
    }
    else if(h>=11 && h<18){
        document.body.style.background = "#d4f1ff";
        text.innerText = "HAPPY DAY";
        sun.style.opacity = 0.5;
    }
    else if(h>=18 && h<22){
        document.body.style.background = "#ff9966";
        text.innerText = "BEFORE NIGHT";
        sun.style.opacity = 0.2;
    }
    else{
        document.body.style.background = "#0b0f1a";
        text.innerText = "NIGHT NEED TO SLEEP";
        sun.style.opacity = 0;
    }
}

/* твой код */
let username, avatar;

window.login=function(){
username=document.getElementById("nickname").value;
let file=document.getElementById("avatarInput").files[0];
let reader=new FileReader();
reader.onload=function(){
avatar=reader.result;
localStorage.setItem("username",username);
localStorage.setItem("avatar",avatar);
start();
}
reader.readAsDataURL(file);
}

function start(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("user").innerText=username;
document.getElementById("myavatar").src=avatar;
document.getElementById("profileBtnImg").src=avatar;
}

window.theme=function(){
document.body.classList.toggle("dark");
}

window.post=function(){
let text=document.getElementById("text").value;

let div=document.createElement("div");
div.className="post";
div.innerText=username+": "+text;

document.getElementById("posts").prepend(div);
}

</script>

</body>
</html>
