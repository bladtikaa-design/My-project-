<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>
body{margin:0;font-family:sans-serif;text-align:center;background:#f0f0f0;}
.dark{background:#000;color:white;}

#chat{
position:fixed;
bottom:0;
right:0;
width:300px;
height:350px;
background:white;
display:none;
flex-direction:column;
}

#messages{flex:1;overflow:auto;color:black;}
</style>
</head>

<body>

<div id="login">
<input id="nickname" placeholder="Nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">
<b id="user"></b>
</div>

<!-- ПРОФИЛЬ -->
<div id="profile">
<button id="inviteRoom">📞 Invite</button>
</div>

<!-- ЧАТ -->
<div id="chat">

<div id="roomId" style="background:black;color:white;"></div>

<div>
<button id="closeRoom">❌ Close</button>
</div>

<div id="messages"></div>
<input id="msg">
<button onclick="sendMsg()">Send</button>

</div>

<!-- POPUP -->
<div id="invitePopup" style="
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:black;
color:white;
padding:20px;
">
<div id="inviteText"></div>
<button id="acceptInvite" style="color:lime;">ACCEPT</button>
<button id="declineInvite" style="color:red;">DECLINE</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
});

const db=getFirestore(app);

let username=localStorage.getItem("username")||"";
let avatar=localStorage.getItem("avatar")||"";

let currentRoom="";
let roomOwner="";

/* АВТО ВХОД */
if(username && avatar) start();

/* LOGIN FIX */
window.login=function(){
let name=document.getElementById("nickname").value;
let file=document.getElementById("avatarInput").files[0];

if(!name || !file) return alert("Enter name + avatar");

let reader=new FileReader();
reader.onload=function(){
localStorage.setItem("username",name);
localStorage.setItem("avatar",reader.result);

username=name;
avatar=reader.result;

start();
}
reader.readAsDataURL(file);
}

function start(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("user").innerText=username;
}

/* ID */
function generateRoomId(){
let l="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let id="";
for(let i=0;i<4;i++){
id+=l[Math.floor(Math.random()*l.length)];
}
return id;
}

/* 📞 INVITE */
document.getElementById("inviteRoom").onclick=async()=>{

let room=generateRoomId();

await addDoc(collection(db,"invites"),{
from:username,
room:room
});

alert("Invite sent");
}

/* LISTEN INVITE */
onSnapshot(collection(db,"invites"),snap=>{
snap.forEach(d=>{
let data=d.data();

if(data.from!=username){
document.getElementById("invitePopup").style.display="block";
document.getElementById("inviteText").innerText=data.from+" invites you";
window.inviteId=d.id;

currentRoom=data.room;
roomOwner=data.from;
}
});
});

/* ACCEPT */
document.getElementById("acceptInvite").onclick=async()=>{
document.getElementById("invitePopup").style.display="none";
await deleteDoc(doc(db,"invites",window.inviteId));

openRoom(currentRoom,roomOwner);
}

/* DECLINE */
document.getElementById("declineInvite").onclick=async()=>{
document.getElementById("invitePopup").style.display="none";
await deleteDoc(doc(db,"invites",window.inviteId));
}

/* OPEN ROOM */
function openRoom(room,owner){
currentRoom=room;
roomOwner=owner;

document.getElementById("chat").style.display="flex";
document.getElementById("roomId").innerText="ROOM: "+room;
}

/* CLOSE ROOM */
document.getElementById("closeRoom").onclick=()=>{
if(username!=roomOwner) return alert("Only owner");
document.getElementById("chat").style.display="none";
currentRoom="";
}

/* SEND */
window.sendMsg=async()=>{
let text=document.getElementById("msg").value;

await addDoc(collection(db,"messages"),{
room:currentRoom,
user:username,
text:text
});

document.getElementById("msg").value="";
}

/* LISTEN MSG */
onSnapshot(collection(db,"messages"),snap=>{
document.getElementById("messages").innerHTML="";

snap.forEach(d=>{
let data=d.data();

if(data.room==currentRoom){
let div=document.createElement("div");
div.innerText=data.user+": "+data.text;
document.getElementById("messages").append(div);
}
});
});

</script>

</body>
</html>
