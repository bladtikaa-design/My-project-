<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Social</title>
<style>
body{font-family:sans-serif;background:#f0f0f0;text-align:center;margin:0;}
#top{background:white;padding:10px;}
.post{background:white;margin:10px auto;padding:10px;border-radius:10px;max-width:400px;position:relative;}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;}
.postimg{max-width:100%;border-radius:10px;margin-top:5px;}
.delete{position:absolute;top:5px;right:5px;border:none;background:red;color:white;border-radius:10px;cursor:pointer;}
.dark{background:#111;color:white;}
.dark .post{background:#1e1e1e;}
#profileDiv{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#222;color:white;padding:15px;border-radius:10px;z-index:1000;width:300px;}
#dmMessages{height:120px;overflow-y:auto;background:#111;padding:5px;border-radius:5px;margin-bottom:5px;}
#callVideo{display:none;width:100%;margin-top:5px;border-radius:10px;}
#incomingCall{display:none;background:#333;color:white;padding:10px;border-radius:10px;margin-bottom:5px;}
#callUserBtn{padding:5px 8px;border:none;background:blue;color:white;border-radius:5px;cursor:pointer;margin-bottom:5px;}

/* ---------------- Drawing Panel ---------------- */
#drawingPanel{
  position:fixed; bottom:90px; right:10px; width:420px; background:#ccc; padding:10px; border-radius:10px; z-index:1001;
  box-shadow:0 0 5px rgba(0,0,0,0.3);
}
#drawingCanvas{border:1px solid #999; border-radius:10px; touch-action:none;}
#palette{margin-top:5px;}
.colorBtn{width:25px; height:25px; display:inline-block; margin:2px; border-radius:5px; cursor:pointer; border:1px solid #333;}
#fillBtn, #clearBtn, #postDrawBtn{padding:5px 8px; margin:3px; border:none; border-radius:5px; cursor:pointer;}
#drawHeader{font-weight:bold;margin-bottom:5px;color:#333;}

/* ---------------- Liquid Glass Button ---------------- */
.liquidGlass {
  position: fixed;
  bottom:20px; left:50%; transform:translateX(-50%);
  background: rgba(255, 255, 255, 0.2);
  border-radius: 30px; padding: 15px 50px;
  color: #fff; font-weight: bold; text-align: center; font-family: sans-serif;
  box-shadow: 0 8px 32px 0 rgba(0,0,0,0.2), 0 0 1px 1px rgba(255,255,255,0.3) inset;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.3); cursor: default; z-index: 1000;
  transition: 0.3s;
}
.liquidGlass:hover {
  background: rgba(255, 255, 255, 0.3);
  box-shadow: 0 12px 40px 0 rgba(0,0,0,0.25), 0 0 2px 2px rgba(255,255,255,0.4) inset;
}

/* ---------------- Top Left Text ---------------- */
#siteText {
  position: fixed; top:10px; left:10px; z-index:1002;
  font-weight:bold; font-size:20px; font-family:sans-serif;
  background: linear-gradient(90deg, #00ff00, #009900, #00ff55, #00aa00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientShift 4s ease infinite;
}
@keyframes gradientShift {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
</style>

<!-- Подключение Google reCAPTCHA -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

<div id="siteText">BLADTIK SITE OFFICIAL</div>

<div id="login">
<h2>Nickname</h2>
<input id="nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<div class="g-recaptcha" data-sitekey="6LfBxYQsAAAAAEdWSoTfDLNQw5VqQcexGKbzuDY3"></div><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">
<div id="top">
<img id="myavatar" class="avatar">
<b id="user"></b>
<button onclick="theme()">🌙</button>
</div>
<br>
<input id="text" placeholder="Write post"><br><br>
<input type="file" id="photo"><br><br>
<button onclick="post()">Post</button>
<div id="posts"></div>
</div>

<div id="profileDiv">
<b id="profileNick"></b><br>
<button id="callUserBtn">📞 Позвонить</button><br><br>
<div id="dmMessages"></div>
<input id="dmInput" placeholder="Написать..." style="width:70%;padding:5px;border-radius:5px;border:none;">
<button id="dmSend">➤</button><br><br>
<div id="incomingCall">
<b id="callerName"></b> звонит!<br>
<button id="acceptCallBtn">Принять</button>
<button id="rejectCallBtn">Отклонить</button>
</div>
<video id="callVideo" autoplay playsinline></video><br>
<button id="closeProfile">Закрыть</button>
</div>

<audio id="ringtone" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>

<!-- ---------------- Drawing Panel ---------------- -->
<div id="drawingPanel">
  <div id="drawHeader">BLADTIK DRAW</div>
  <canvas id="drawingCanvas" width="400" height="300"></canvas><br>
  <div id="palette">
    <div class="colorBtn" style="background:black;" data-color="#000"></div>
    <div class="colorBtn" style="background:red;" data-color="red"></div>
    <div class="colorBtn" style="background:blue;" data-color="blue"></div>
    <div class="colorBtn" style="background:green;" data-color="green"></div>
    <div class="colorBtn" style="background:yellow;" data-color="yellow"></div>
    <div class="colorBtn" style="background:white;" data-color="white"></div>
  </div>
  <button id="fillBtn">Fill</button>
  <button id="clearBtn">Clear</button>
  <button id="postDrawBtn">Post Drawing</button>
</div>

<!-- ---------------- Liquid Glass Button ---------------- -->
<div class="liquidGlass">
  BLADTIK BUTTON
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAE46eiz4XltTwoPz4mVFG6kvPqAIhVf10",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf",
storageBucket:"mysocial-dabdf.firebasestorage.app",
messagingSenderId:"812073291348",
appId:"1:812073291348:web:e68dbf6c412c72de5aa7c1",
measurementId:"G-24XWVXT1HV"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let username = localStorage.getItem("username");
let avatar = localStorage.getItem("avatar");
let messages = {};
let activeProfile = "";
let peerConnection, localStream;
let currentCallDoc = null;

// ---------------- Profile ----------------
window.openProfile = function(user){
    activeProfile = user;
    document.getElementById("profileDiv").style.display="block";
    document.getElementById("profileNick").innerText = user;
    if(!messages[user]) messages[user] = [];
    updateDM();
};
document.getElementById("closeProfile").onclick = ()=>{
    document.getElementById("profileDiv").style.display="none";
    document.getElementById("callVideo").style.display="none";
    endCall();
};

// ---------------- Login ----------------
window.login=function(){
    const response = grecaptcha.getResponse();
    if(response.length === 0){
        return alert("Пожалуйста, подтвердите, что вы не робот!");
    }
    username=document.getElementById("nickname").value;
    if(!username) return alert("Введите ник!");
    let file=document.getElementById("avatarInput").files[0];
    if(!file) return alert("Выберите аватар!");
    let reader=new FileReader();
    reader.onload=function(){ 
        avatar=reader.result; 
        localStorage.setItem("username",username); 
        localStorage.setItem("avatar",avatar); 
        afterLogin();
        grecaptcha.reset();
    }
    reader.readAsDataURL(file);
}

// ---------------- After Login ----------------
function afterLogin(){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("user").innerText=username;
    document.getElementById("myavatar").src=avatar;
    if(username==="bladtikaa-design"){ 
        document.getElementById("user").innerHTML += ' <span style="color:red;font-weight:bold;">DEVELOPER</span> <span style="background:black;color:red;border-radius:50%;padding:3px 6px;">✔</span>';
    }
    startRealtime();
    startCamera();
}

// ---------------- Posts ----------------
window.post=async function(){
    let text=document.getElementById("text").value;
    let photoFile=document.getElementById("photo").files[0]; 
    let photo="";
    if(photoFile){ 
        let reader=new FileReader(); 
        reader.onload=async function(){ 
            photo=reader.result; 
            await addDoc(collection(db,"posts"),{user:username,avatar:avatar,text:text,photo:photo,like:0}); 
        } 
        reader.readAsDataURL(photoFile); 
    } else{ 
        await addDoc(collection(db,"posts"),{user:username,avatar:avatar,text:text,photo:"",like:0}); 
    }
}

// ---------------- Real-time posts & messages ----------------
function startRealtime(){
    onSnapshot(collection(db,"posts"),(snapshot)=>{
        document.getElementById("posts").innerHTML="";
        snapshot.forEach((docSnap)=>{
            let data=docSnap.data();
            let div=document.createElement("div"); 
            div.className="post";
            let img=data.photo?`<img class='postimg' src='${data.photo}'>`:"";
            let del=(data.user===username)?`<button class='delete' onclick='delPost("${docSnap.id}")'>🗑</button>`:"";
            div.innerHTML=del+`<img class='avatar' src='${data.avatar}' onclick='openProfile("${data.user}")'> <b onclick='openProfile("${data.user}")'>${data.user}</b><br>${data.text}<br>${img}<br><button onclick='like("${docSnap.id}",${data.like})'>👍 ${data.like}</button>`;
            document.getElementById("posts").prepend(div);
        })
    });

    onSnapshot(collection(db,"messages"), snapshot=>{
        snapshot.docChanges().forEach(change=>{
            const data = change.doc.data();
            if((data.from===username && data.to) || (data.to===username && data.from)){
                if(!messages[data.from]) messages[data.from]=[];
                if(!messages[data.to]) messages[data.to]=[];
                if(data.to===username) messages[data.from].push(data);
                else messages[data.to].push(data);
                if(activeProfile===data.from || activeProfile===data.to) updateDM();
            }
        });
    });
}

// ---------------- Likes / Delete / Theme ----------------
window.like=async function(id,count){ await updateDoc(doc(db,"posts",id),{like:count+1}); }
window.delPost=async function(id){ await deleteDoc(doc(db,"posts",id)); }
window.theme=function(){ document.body.classList.toggle("dark"); }

// ---------------- Direct Messages ----------------
document.getElementById("dmSend").onclick=async()=>{
    const txt=document.getElementById("dmInput").value; 
    if(!txt.trim()) return;
    const msgObj={from:username,to:activeProfile,text:txt,time:Date.now()};
    await addDoc(collection(db,"messages"),msgObj); 
    document.getElementById("dmInput").value="";
}
function updateDM(){
    const box=document.getElementById("dmMessages"); 
    box.innerHTML="";
    messages[activeProfile].forEach(m=>{
        const side=(m.from===username)?"text-align:right;":"text-align:left;";
        box.innerHTML+=`<div style="${side}background:#333;margin:2px;padding:3px;border-radius:5px;">${m.from}: ${m.text}</div>`;
    });
    box.scrollTop=box.scrollHeight;
}

// ---------------- WebRTC Calls ----------------
const servers={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
async function startCamera(){ localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); }

async function endCall(){
    if(peerConnection){ peerConnection.close(); peerConnection=null; }
    currentCallDoc=null;
    document.getElementById("callVideo").style.display="none";
}

// ---------------- Drawing ----------------
const canvas = document.getElementById("drawingCanvas");
const ctx = canvas.getContext("2d");
const palette = document.querySelectorAll(".colorBtn");
const fillBtn = document.getElementById("fillBtn");
const clearBtn = document.getElementById("clearBtn");
const postDrawBtn = document.getElementById("postDrawBtn");

let drawing=false, lastX=0, lastY=0;
let currentColor="#000";

palette.forEach(btn=>{
    btn.onclick=()=> currentColor=btn.dataset.color;
});

fillBtn.onclick=()=> ctx.fillRect(0,0,canvas.width,canvas.height);
clearBtn.onclick=()=> ctx.clearRect(0,0,canvas.width,canvas.height);

function startDraw(e){
    drawing=true;
    let rect=canvas.getBoundingClientRect();
    if(e.touches) { lastX=e.touches[0].clientX-rect.left; lastY=e.touches[0].clientY-rect.top; }
    else { lastX=e.offsetX; lastY=e.offsetY; }
}
function drawMove(e){
    if(!drawing) return;
    let rect=canvas.getBoundingClientRect();
    let x=0,y=0;
    if(e.touches) { x=e.touches[0].clientX-rect.left; y=e.touches[0].clientY-rect.top; }
    else { x=e.offsetX; y=e.offsetY; }
    ctx.strokeStyle=currentColor;
    ctx.lineWidth=2;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(x,y);
    ctx.stroke();
    lastX=x; lastY=y;
    e.preventDefault();
}
function endDraw(){drawing=false;}
canvas.addEventListener("mousedown",startDraw);
canvas.addEventListener("mousemove",drawMove);
canvas.addEventListener("mouseup",endDraw);
canvas.addEventListener("mouseout",endDraw);
canvas.addEventListener("touchstart",startDraw);
canvas.addEventListener("touchmove",drawMove);
canvas.addEventListener("touchend",endDraw);

postDrawBtn.onclick = async()=>{
    const text = document.getElementById("text").value || "";
    const dataURL = canvas.toDataURL("image/png");
    await addDoc(collection(db,"posts"),{user:username,avatar:avatar,text:text,photo:dataURL,like:0});
    ctx.clearRect(0,0,canvas.width,canvas.height);
    document.getElementById("text").value="";
};
</script>
</body>
</html>
