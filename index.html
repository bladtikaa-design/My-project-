<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>
<style>
body{
  margin:0;
  font-family:sans-serif;
  text-align:center;
  background:#f0f0f0;
}
.dark{background:#000;color:white;}

/* 🌌 stars */
#stars .star{
  position:absolute;
  background:white;
  border-radius:50%;
}

/* animated text */
#animatedText{
  font-size:28px;
  font-weight:bold;
  color:#00ff00;
  animation:glow 1.5s infinite alternate;
}
@keyframes glow{from{opacity:0.7;}to{opacity:1;}}

/* cooldown timer */
#cooldownTimer{
  position:fixed;
  bottom:100px;
  right:20px;
  background:rgba(0,0,0,0.7);
  color:white;
  padding:10px 15px;
  border-radius:12px;
  display:none;
}

/* hashtags */
#hashtagsBox{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:15px;
  border-radius:10px;
  display:none;
  z-index:100;
}
#closeTags{cursor:pointer; float:right;}

/* login */
#login input{padding:10px; margin:5px;}
#login button{padding:10px 15px; cursor:pointer;}

/* app */
#app{display:block;}
.avatar{width:50px;height:50px;border-radius:50%;}
.mainBtn{padding:10px 15px;margin:5px;cursor:pointer;}

/* profile button */
#profileButton{
  position:fixed;
  bottom:20px;
  right:20px;
  width:200px;
  height:60px;
  border-radius:40px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  gap:10px;
  padding-left:10px;
  cursor:pointer;
}
#profileButton img{
  width:45px;
  height:45px;
  border-radius:50%;
}

/* profile */
#profile{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  color:white;
  display:none;
  padding:20px;
  overflow:auto;
}
#close{
  position:absolute;
  top:20px;
  right:20px;
  font-size:30px;
  cursor:pointer;
}
#avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  border:3px solid white;
}
#subscribe,#dm{
  border:none;
  padding:10px 15px;
  border-radius:20px;
  margin:5px;
  cursor:pointer;
}

/* chat */
#chat{
  position:fixed;
  bottom:0;
  right:0;
  width:300px;
  height:350px;
  background:white;
  display:none;
  flex-direction:column;
}
#messages{
  flex:1;
  overflow:auto;
  color:black;
}

/* ---------------- Liquid Glass Bubble (Vehicle Motion Cues) ---------------- */
#motionBubble {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 250px;
  height: 60px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: white;
  gap: 10px;
  z-index: 999;
  overflow: hidden;
  pointer-events: none;
}
.motionDot {
  position: absolute;
  width: 15px;
  height: 15px;
  background: white;
  border-radius: 50%;
  top: 50%;
  transform: translateY(-50%);
  animation: dotMove 2s infinite ease-in-out;
  opacity: 0.7;
}
@keyframes dotMove {
  0%,80%,100%{ transform: translateY(-50%) scale(0); opacity:0.5; }
  40%{ transform: translateY(-50%) scale(1); opacity:1; }
}
</style>
</head>
<body>

<div id="stars"></div>
<div id="animatedText">BLADTIK SITE OFFICIAL</div>
<div id="cooldownTimer"></div>

<div id="hashtagsBox">
  <div id="closeTags" onclick="closeHashtags()">✖</div>
  <div id="tagsContent"></div>
</div>

<div id="login">
  <input id="nickname" placeholder="Nickname"><br><br>
  <input type="file" id="avatarInput"><br><br>
  <button onclick="login()">Enter</button>
</div>

<div id="app">
  <div>
    <img id="myavatar" class="avatar">
    <b id="user"></b>
    <button onclick="theme()">🌙</button>
  </div>
  <br>
  <input id="text" placeholder="Write post"><br><br>
  <input type="file" id="photo"><br><br>
  <button class="mainBtn" onclick="post()">Post</button>
  <button class="mainBtn" onclick="showHashtags()">🔥 Popular #</button>
  <div id="posts"></div>
</div>

<div id="profileButton">
  <img id="profileBtnImg">
  <span>MY PROFILE</span>
  <button onclick="editAvatar()" style="margin-left:10px;padding:5px 10px;border-radius:12px;cursor:pointer;">Edit My Avatar</button>
</div>

<div id="profile">
  <div id="close" onclick="closeProfile()">✖</div>
  <img id="avatar">
  <h2 id="nick"></h2>
  <div>Subscribers: <span id="subs">0</span></div>
  <button id="subscribe">Subscribe</button>
  <button id="dm">💬 DM MESSAGE</button>
  <div id="profilePosts"></div>
</div>

<div id="chat">
  <div id="messages"></div>
  <input id="msg">
  <button onclick="sendMsg()">Send</button>
</div>

<!-- Vehicle Motion Cues Bubble -->
<div id="motionBubble">
  <span>🚗 Vehicle Motion Cues</span>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyAE46",
  authDomain:"mysocial-dabdf.firebaseapp.com",
  projectId:"mysocial-dabdf"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let lastPostTime=0;
let cooldownInterval=null;
let hashtags={};

/* 🌌 stars */
for(let i=0;i<120;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.width=(Math.random()*2+1)+"px";
  s.style.height=s.style.width;
  document.getElementById("stars").appendChild(s);
}

/* ⚡ user data */
let username=localStorage.getItem("username");
let avatar=localStorage.getItem("avatar");
let lastAvatarChange = localStorage.getItem("lastAvatarChange");
if(username) start();

window.login=function(){
  username=document.getElementById("nickname").value;
  let file=document.getElementById("avatarInput").files[0];
  let reader=new FileReader();
  reader.onload=function(){
    avatar=reader.result;
    localStorage.setItem("username",username);
    localStorage.setItem("avatar",avatar);
    start();
  }
  reader.readAsDataURL(file);
}

function start(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("user").innerText=username;
  document.getElementById("myavatar").src=avatar;
  document.getElementById("profileBtnImg").src=avatar;
}

/* Theme toggle */
window.theme=function(){ document.body.classList.toggle("dark"); }

/* Cooldown timer */
function startCooldown(){
  let t=document.getElementById("cooldownTimer");
  clearInterval(cooldownInterval);
  cooldownInterval=setInterval(()=>{
    let left=20000-(Date.now()-lastPostTime);
    if(left<=0){ clearInterval(cooldownInterval); t.style.display="none"; return; }
    t.innerText="You can post again in "+Math.ceil(left/1000)+"s";
    t.style.display="block";
  },200);
}

/* Post */
window.post=function(){
  if(Date.now()-lastPostTime<20000){ startCooldown(); return; }
  lastPostTime=Date.now(); startCooldown();
  let text=document.getElementById("text").value;
  let file=document.getElementById("photo").files[0];
  if(file){
    let r=new FileReader();
    r.onload=async()=>{ await addDoc(collection(db,"posts"),{user:username,avatar:avatar,text:text,photo:r.result,like:0}); }
    r.readAsDataURL(file);
  }else{
    addDoc(collection(db,"posts"),{user:username,avatar:avatar,text:text,photo:"",like:0});
  }
}

/* Hashtags */
function updateHashtags(posts){
  hashtags={};
  posts.forEach(p=>{ p.text.split(" ").forEach(w=>{ if(w.startsWith("#")){ hashtags[w]=(hashtags[w]||0)+1; } }); });
}
window.showHashtags=function(){
  let box=document.getElementById("hashtagsBox");
  let content=document.getElementById("tagsContent");
  box.style.display="block";
  let arr=[];
  for(let t in hashtags){ arr.push({tag:t,count:hashtags[t]}); }
  arr.sort((a,b)=>b.count-a.count);
  content.innerHTML="<b>Popular hashtags:</b><br><br>";
  arr.forEach(t=>{ content.innerHTML+=t.tag+" ("+t.count+")<br>"; });
}
window.closeHashtags=function(){ document.getElementById("hashtagsBox").style.display="none"; }

/* Posts snapshot */
onSnapshot(collection(db,"posts"),snap=>{
  let arr=[];
  snap.forEach(d=>{ arr.push({id:d.id,...d.data()}); });
  arr.sort((a,b)=>b.like-a.like);
  document.getElementById("posts").innerHTML="";
  arr.forEach(data=>{
    let img=data.photo?`<img class="postimg" src="${data.photo}">`:"";
    let del=""; if(data.user==username){ del=`<button class="deleteBtn" onclick="delPost('${data.id}')">🗑</button>`; }
    let div=document.createElement("div");
    div.className="post";
    div.innerHTML=`${del}<img class="avatar" src="${data.avatar}" onclick="openProfile('${data.user}','${data.avatar}')"><b>${data.user}</b><br>${data.text}${img}<br><button class="like" onclick="like('${data.id}',${data.like})">👍 ${data.like}</button>`;
    document.getElementById("posts").append(div);
  });
  updateHashtags(arr);
});
window.like=async(id,count)=>{ await updateDoc(doc(db,"posts",id),{like:count+1}); }
window.delPost=async id=>{ if(confirm("Delete post?")) await deleteDoc(doc(db,"posts",id)); }

/* Profile */
let openUser="";
window.openProfile=async(user,av)=>{
  openUser=user;
  document.getElementById("profile").style.display="block";
  document.getElementById("nick").innerText=user;
  document.getElementById("avatar").src=av;
  let snap=await getDocs(collection(db,"posts"));
  document.getElementById("profilePosts").innerHTML="";
  snap.forEach(p=>{ let d=p.data(); if(d.user==user){ let div=document.createElement("div"); div.className="post"; div.innerHTML=`${d.text}<br><img class="postimg" src="${d.photo}">`; document.getElementById("profilePosts").append(div); }});
  loadSubs();
}
document.getElementById("profileButton").onclick=()=>{ openProfile(username,avatar); }

/* Subs */
async function loadSubs(){ let snap=await getDocs(collection(db,"subs")); let c=0; snap.forEach(d=>{ if(d.data().to==openUser) c++; }); document.getElementById("subs").innerText=c; }
document.getElementById("subscribe").onclick=async()=>{
  if(openUser==username) return;
  let q=query(collection(db,"subs"),where("from","==",username),where("to","==",openUser));
  let snap=await getDocs(q);
  if(!snap.empty) return alert("Already subscribed");
  await addDoc(collection(db,"subs"),{from:username,to:openUser});
  loadSubs();
}

/* Chat */
document.getElementById("dm").onclick=()=>{ document.getElementById("chat").style.display="flex"; }
window.sendMsg=()=>{
  let text=document.getElementById("msg").value;
  let div=document.createElement("div");
  div.innerText=username+": "+text;
  document.getElementById("messages").append(div);
  document.getElementById("msg").value="";
}
window.closeProfile=()=>{ document.getElementById("profile").style.display="none"; }

/* Edit Avatar once per day */
window.editAvatar = () => {
  let today = new Date().toDateString();
  if(lastAvatarChange === today){ alert("You can change your avatar only once per day!"); return; }
  let input = document.createElement("input"); input.type="file"; input.accept="image/*";
  input.onchange = e => { let file = e.target.files[0]; if(!file) return; let reader=new FileReader();
    reader.onload=()=>{ avatar=reader.result; localStorage.setItem("avatar",avatar); localStorage.setItem("lastAvatarChange",today); lastAvatarChange=today;
      document.getElementById("myavatar").src=avatar; document.getElementById("profileBtnImg").src=avatar;
      if(document.getElementById("avatar")) document.getElementById("avatar").src=avatar; }
    reader.readAsDataURL(file); }
  input.click();
}

/* Vehicle Motion Cues Animation */
const bubble=document.getElementById("motionBubble");
for(let i=0;i<5;i++){
  let dot=document.createElement("div"); dot.className="motionDot";
  dot.style.left=`${20+i*45}px`;
  dot.style.animationDelay=`${i*0.3}s`;
  bubble.appendChild(dot);
}

// Optional: simulate motion using DeviceMotion
if('DeviceMotionEvent' in window){
  window.addEventListener('devicemotion',e=>{
    let x = e.accelerationIncludingGravity.x||0;
    bubble.style.transform = `translateX(calc(-50% + ${x*2}px))`;
  });
}

</script>
</body>
</html>
