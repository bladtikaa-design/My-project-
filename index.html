 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>
body{
margin:0;
font-family:sans-serif;
text-align:center;
background:#f0f0f0;
transition:background 2s, color 2s;
}
.dark{
background:#000;
color:white;
}

/* 🌗 DAY NIGHT */
#dayNightText{
position:fixed;
top:60px;
left:50%;
transform:translateX(-50%);
font-size:22px;
font-weight:bold;
z-index:999;
color:white;
text-shadow:0 0 10px black, 0 0 20px black;
pointer-events:none;
}

#sunRay{
position:fixed;
top:0;
left:50%;
transform:translateX(-50%);
width:200px;
height:200px;
background:radial-gradient(circle, rgba(255,255,0,0.6), transparent 70%);
filter:blur(40px);
opacity:0;
transition:opacity 2s;
pointer-events:none;
}

/* кнопка текст */
#dayNightBtn{
color:white;
text-shadow:0 0 5px black, 0 0 10px black;
}

/* остальное НЕ ТРОГАЛ */
#animatedText{
font-size:28px;
font-weight:bold;
color:#00ff00;
animation:glow 2s infinite alternate;
}
@keyframes glow{
0%{color:#00ff00;}
50%{color:#55ff55;}
100%{color:#007700;}
}
#cooldownTimer{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
padding:12px 25px;
border-radius:30px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
color:#00ffcc;
font-weight:bold;
display:none;
z-index:999;
}
#hashtagsBox{
position:fixed;
top:100px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
color:white;
padding:20px;
border-radius:15px;
backdrop-filter:blur(10px);
max-width:300px;
display:none;
}
#closeTags{
position:absolute;
top:8px;
right:12px;
cursor:pointer;
font-size:18px;
}
#stars{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}
.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:move 8s linear infinite;
}
@keyframes move{
from{transform:translateY(-10px)}
to{transform:translateY(100vh)}
}
.post{
background:white;
max-width:400px;
margin:10px auto;
padding:10px;
border-radius:12px;
position:relative;
}
.dark .post{
background:#111;
}
.avatar{
width:40px;
height:40px;
border-radius:50%;
cursor:pointer;
}
.postimg{
max-width:100%;
border-radius:10px;
margin-top:5px;
}
.like{
border:none;
padding:6px 12px;
border-radius:10px;
cursor:pointer;
}
.deleteBtn{
position:absolute;
top:8px;
right:8px;
background:red;
color:white;
border:none;
border-radius:10px;
padding:5px 8px;
cursor:pointer;
font-size:16px;
}
.mainBtn{
border:none;
padding:10px 15px;
border-radius:20px;
cursor:pointer;
margin:5px;
}

/* liquid glass */
#profileButton{
position:fixed;
bottom:20px;
right:20px;
width:240px;
height:60px;
border-radius:40px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
display:flex;
align-items:center;
gap:10px;
padding-left:10px;
cursor:pointer;
}
#profileButton img{
width:45px;
height:45px;
border-radius:50%;
}

/* профиль */
#profile{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:white;
display:none;
padding:20px;
overflow:auto;
}
#close{
position:absolute;
top:20px;
right:20px;
font-size:30px;
cursor:pointer;
}
#avatar{
width:100px;
height:100px;
border-radius:50%;
border:3px solid white;
}
#subscribe,#dm{
border:none;
padding:10px 15px;
border-radius:20px;
margin:5px;
cursor:pointer;
}

/* чат */
#chat{
position:fixed;
bottom:0;
right:0;
width:300px;
height:350px;
background:white;
display:none;
flex-direction:column;
}
#messages{
flex:1;
overflow:auto;
color:black;
}

/* loading */
#loadingScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:1000;
}
</style>
</head>

<body>

<div id="sunRay"></div>
<div id="dayNightText"></div>

<div id="loadingScreen">
Loading...
</div>

<div id="animatedText">BLADTIK SITE OFFICIAL</div>

<div id="login">
<input id="nickname" placeholder="Nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">
<img id="myavatar" class="avatar">
<b id="user"></b>
<button onclick="theme()">🌙</button>

<br><br>

<input id="text" placeholder="Write post"><br><br>
<button onclick="post()">Post</button>

<div id="posts"></div>
</div>

<div id="profileButton">
<img id="profileBtnImg">
<span>MY PROFILE</span>

<button id="dayNightBtn" onclick="toggleDayNight()" style="margin-left:5px;padding:5px 10px;border-radius:12px;cursor:pointer;">
TURN ON NIGHT-DAY
</button>
</div>

<script type="module">

let dayNightEnabled = false;

/* 🌗 включение */
window.toggleDayNight = () => {
    dayNightEnabled = !dayNightEnabled;

    if(dayNightEnabled){
        updateDayNight();
        setInterval(updateDayNight, 60000);
    }else{
        document.body.style.background = "#f0f0f0";
        document.getElementById("dayNightText").innerText = "";
        document.getElementById("sunRay").style.opacity = 0;
    }
}

/* 🌍 логика времени */
function updateDayNight(){
    let h = new Date().getHours();
    let text = document.getElementById("dayNightText");
    let sun = document.getElementById("sunRay");

    if(h>=6 && h<11){
        document.body.style.background = "linear-gradient(#87cefa,#fff)";
        text.innerText = "GOOD MORNING LIQUID GLASS";
        sun.style.opacity = 1;
    }
    else if(h>=11 && h<18){
        document.body.style.background = "#d4f1ff";
        text.innerText = "HAPPY DAY";
        sun.style.opacity = 0.5;
    }
    else if(h>=18 && h<22){
        document.body.style.background = "#ff9966";
        text.innerText = "BEFORE NIGHT";
        sun.style.opacity = 0.2;
    }
    else{
        document.body.style.background = "#0b0f1a";
        text.innerText = "NIGHT NEED TO SLEEP";
        sun.style.opacity = 0;
    }
}

/* остальной твой код не трогал */
let username, avatar;

window.login=function(){
username=document.getElementById("nickname").value;
let file=document.getElementById("avatarInput").files[0];
let reader=new FileReader();
reader.onload=function(){
avatar=reader.result;
localStorage.setItem("username",username);
localStorage.setItem("avatar",avatar);
start();
}
reader.readAsDataURL(file);
}

function start(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("user").innerText=username;
document.getElementById("myavatar").src=avatar;
document.getElementById("profileBtnImg").src=avatar;
}

window.theme=function(){
document.body.classList.toggle("dark");
}

window.post=function(){
let text=document.getElementById("text").value;

let div=document.createElement("div");
div.className="post";
div.innerText=username+": "+text;

document.getElementById("posts").prepend(div);
}

/* loading */
setTimeout(()=>{
document.getElementById("loadingScreen").style.display="none";
},2000);

</script>

</body>
</html>
