<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>
body{margin:0;font-family:sans-serif;text-align:center;background:#f0f0f0;}
.dark{background:#000;color:white;}

#radarBox{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
padding:15px 30px;
border-radius:30px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
color:#00ffcc;
display:none;
z-index:9999;
}

#chat{
position:fixed;
bottom:0;
right:0;
width:300px;
height:350px;
background:white;
display:none;
flex-direction:column;
}
#messages{flex:1;overflow:auto;color:black;}

#nearbyBox{
position:fixed;
bottom:0;
left:0;
width:100%;
max-height:200px;
background:rgba(0,0,0,0.8);
color:white;
overflow:auto;
display:none;
padding:10px;
}

button{
padding:8px;
margin:5px;
border-radius:10px;
border:none;
cursor:pointer;
}
</style>
</head>

<body>

<h2>BLADTIK AIRDROP 🔥</h2>

<div id="radarBox">📡 Searching...</div>

<div id="login">
<input id="nickname" placeholder="Nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">

<button onclick="enableMotion()">📳 Enable Shake</button>
<button onclick="toggleNearby()">👥 People nearby</button>

<div>
<img id="myavatar" style="width:40px;border-radius:50%">
<b id="user"></b>
</div>

</div>

<div id="nearbyBox">
<b>👥 People nearby:</b>
<div id="nearbyList"></div>
</div>

<div id="chat">
<div id="messages"></div>
<input id="msg">
<button onclick="sendMsg()">Send</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import {
getFirestore, collection, addDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
});
const db=getFirestore(app);

let username,avatar;
let myPos=null;
let currentChat=null;

/* login */
window.login=function(){
username=document.getElementById("nickname").value;
let file=document.getElementById("avatarInput").files[0];
let r=new FileReader();
r.onload=()=>{
avatar=r.result;
start();
}
r.readAsDataURL(file);
}

function start(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("user").innerText=username;
document.getElementById("myavatar").src=avatar;

/* GPS */
navigator.geolocation.watchPosition(pos=>{
myPos={
lat:pos.coords.latitude,
lon:pos.coords.longitude
};

addDoc(collection(db,"geo"),{
user:username,
lat:myPos.lat,
lon:myPos.lon,
time:Date.now()
});
});
}

/* 📳 iPhone */
window.enableMotion=async()=>{
if(typeof DeviceMotionEvent!=="undefined" &&
typeof DeviceMotionEvent.requestPermission==="function"){
let res=await DeviceMotionEvent.requestPermission();
if(res==="granted") alert("Shake ON");
}
};

/* 📡 SHAKE */
let lastShake=0;

window.addEventListener("devicemotion",(e)=>{
let a=e.accelerationIncludingGravity;
if(!a) return;

let power=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);

if(power>25){
if(Date.now()-lastShake<3000) return;
lastShake=Date.now();
startRadar();
}
});

async function startRadar(){
let radar=document.getElementById("radarBox");
radar.style.display="block";
radar.innerText="📡 Searching...";

await addDoc(collection(db,"radar"),{
user:username,
time:Date.now()
});

onSnapshot(collection(db,"radar"),snap=>{
snap.forEach(d=>{
let data=d.data();

if(data.user!==username && Date.now()-data.time<5000){
radar.innerText="✅ CONNECTED WITH "+data.user;

startChat(data.user);

setTimeout(()=>radar.style.display="none",3000);
}
});
});
}

/* 📏 расстояние */
function dist(a,b){
let R=6371;
let dLat=(b.lat-a.lat)*Math.PI/180;
let dLon=(b.lon-a.lon)*Math.PI/180;

let x=Math.sin(dLat/2)**2+
Math.cos(a.lat*Math.PI/180)*
Math.cos(b.lat*Math.PI/180)*
Math.sin(dLon/2)**2;

return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1000;
}

/* 👥 nearby */
window.toggleNearby=()=>{
let box=document.getElementById("nearbyBox");
box.style.display = box.style.display==="none" ? "block":"none";
};

onSnapshot(collection(db,"geo"),snap=>{
let list=document.getElementById("nearbyList");
list.innerHTML="";

snap.forEach(doc=>{
let d=doc.data();

if(d.user!==username && myPos){

let distance=dist(myPos,{lat:d.lat,lon:d.lon});

if(distance<100){

let div=document.createElement("div");
div.innerHTML=`
${d.user} (${Math.floor(distance)}m)
<button onclick="connectUser('${d.user}')">CONNECT</button>
`;

list.append(div);
}
}
});
});

/* 🤝 connect */
window.connectUser=(user)=>{
startChat(user);
};

/* 💬 чат */
function chatId(a,b){
return [a,b].sort().join("_");
}

function startChat(user){
currentChat=chatId(username,user);

document.getElementById("chat").style.display="flex";

onSnapshot(collection(db,"messages"),snap=>{
let box=document.getElementById("messages");
box.innerHTML="";

snap.forEach(doc=>{
let d=doc.data();

if(d.chat===currentChat){
let div=document.createElement("div");
div.innerText=d.user+": "+d.text;
box.append(div);
}
});
});
}

window.sendMsg=()=>{
let text=document.getElementById("msg").value;

addDoc(collection(db,"messages"),{
chat:currentChat,
user:username,
text:text,
time:Date.now()
});

document.getElementById("msg").value="";
};

</script>

</body>
</html>
