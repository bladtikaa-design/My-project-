<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Social</title>

<style>

body{
font-family:sans-serif;
background:#f0f0f0;
text-align:center;
margin:0;
}

/* ----------- GREEN ANIMATION TEXT ----------- */

#animatedText{
font-size:24px;
font-weight:bold;
animation:greenGlow 2s infinite alternate;
}

@keyframes greenGlow{
0%{color:#00ff00;}
50%{color:#66ff66;}
100%{color:#007700;}
}

/* ----------- TOP BAR ----------- */

#top{
background:white;
padding:10px;
display:flex;
align-items:center;
justify-content:center;
gap:15px;
}

/* ----------- POSTS ----------- */

.post{
background:white;
margin:10px auto;
padding:10px;
border-radius:10px;
max-width:400px;
position:relative;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
object-fit:cover;
cursor:pointer;
}

.postimg{
max-width:100%;
border-radius:10px;
margin-top:5px;
}

.delete{
position:absolute;
top:5px;
right:5px;
border:none;
background:red;
color:white;
border-radius:10px;
cursor:pointer;
}

/* ----------- BELL ----------- */

#bell{
position:relative;
font-size:22px;
cursor:pointer;
color:gray;
}

#bellCount{
position:absolute;
top:-6px;
right:-10px;
background:red;
color:white;
border-radius:50%;
padding:2px 6px;
font-size:12px;
display:none;
}

/* ----------- NOTIFICATION PANEL ----------- */

#notifPanel{
display:none;
position:fixed;
top:70px;
right:20px;
width:250px;
background:white;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
padding:10px;
max-height:300px;
overflow:auto;
z-index:1000;
}

.notif{
padding:6px;
border-bottom:1px solid #ddd;
font-size:14px;
}

/* ----------- PROFILE BUTTON ----------- */

#profileButton{
position:fixed;
bottom:20px;
right:20px;
height:60px;
width:180px;
border-radius:50px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
display:flex;
align-items:center;
padding-left:10px;
cursor:pointer;
}

#profileButton img{
width:50px;
height:50px;
border-radius:50%;
margin-right:10px;
object-fit:cover;
}

#profileButton span{
font-weight:bold;
}

/* ----------- PROFILE WINDOW ----------- */

#profileDiv{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#222;
color:white;
padding:15px;
border-radius:15px;
width:300px;
z-index:2000;
}

#subscribeBtn{
border:none;
background:#4CAF50;
color:white;
padding:5px 10px;
border-radius:20px;
cursor:pointer;
}

</style>

</head>

<body>

<div id="animatedText">BLADTIK SITE</div>

<div id="top">

<img id="myavatar" class="avatar">

<b id="user"></b>

<div id="bell" onclick="toggleNotif()">
🔔
<div id="bellCount">0</div>
</div>

<button onclick="theme()">🌙</button>

</div>

<br>

<input id="text" placeholder="Write post">
<br><br>

<input type="file" id="photo">
<br><br>

<button onclick="post()">Post</button>

<div id="posts"></div>

<!-- NOTIFICATIONS -->

<div id="notifPanel"></div>

<!-- PROFILE -->

<div id="profileDiv">

<b id="profileNick"></b>
<br>

Subscribers: <span id="subCount">0</span>

<br><br>

<button id="subscribeBtn">Subscribe</button>

<br><br>

<button onclick="closeProfile()">Close</button>

</div>

<!-- PROFILE BUTTON -->

<div id="profileButton" onclick="openProfile(username)">
<img id="profileBtnImg">
<span>My Profile</span>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAE46eiz4XltTwoPz4mVFG6kvPqAIhVf10",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf",
storageBucket:"mysocial-dabdf.firebasestorage.app",
messagingSenderId:"812073291348",
appId:"1:812073291348:web:e68dbf6c412c72de5aa7c1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let username = localStorage.getItem("username");
let avatar = localStorage.getItem("avatar");

let notifications = [];

function addNotification(text){

notifications.push(text);

document.getElementById("notifPanel").innerHTML +=
`<div class="notif">${text}</div>`;

updateBell();

}

function updateBell(){

let count = notifications.length;

let el = document.getElementById("bellCount");

if(count>0){

el.style.display="block";
el.innerText=count;

}else{

el.style.display="none";

}

}

window.toggleNotif=function(){

let p = document.getElementById("notifPanel");

if(p.style.display=="block"){

p.style.display="none";

notifications=[];

updateBell();

}else{

p.style.display="block";

}

}

/* -------- LOGIN -------- */

if(!username){

username=prompt("Enter nickname");

let file=prompt("Paste avatar image link");

avatar=file;

localStorage.setItem("username",username);

localStorage.setItem("avatar",avatar);

}

document.getElementById("user").innerText=username;

document.getElementById("myavatar").src=avatar;

document.getElementById("profileBtnImg").src=avatar;

/* -------- POSTS -------- */

window.post=async function(){

let text=document.getElementById("text").value;

let photoFile=document.getElementById("photo").files[0];

let photo="";

if(photoFile){

let reader=new FileReader();

reader.onload=async function(){

photo=reader.result;

await addDoc(collection(db,"posts"),{
user:username,
avatar:avatar,
text:text,
photo:photo,
like:0
});

}

reader.readAsDataURL(photoFile);

}else{

await addDoc(collection(db,"posts"),{
user:username,
avatar:avatar,
text:text,
photo:"",
like:0
});

}

}

/* -------- POSTS REALTIME -------- */

onSnapshot(collection(db,"posts"),(snapshot)=>{

document.getElementById("posts").innerHTML="";

snapshot.forEach((docSnap)=>{

let data=docSnap.data();

let img=data.photo?`<img class="postimg" src="${data.photo}">`:"";

let del=(data.user===username)?`<button class="delete" onclick='delPost("${docSnap.id}")'>🗑</button>`:"";

let div=document.createElement("div");

div.className="post";

div.innerHTML=

del+

`<img class="avatar" src="${data.avatar}" onclick='openProfile("${data.user}")'>
<b>${data.user}</b>
<br>
${data.text}
<br>
${img}
<br>
<button onclick='like("${docSnap.id}",${data.like},"${data.user}")'>👍 ${data.like}</button>`;

document.getElementById("posts").prepend(div);

});

});

/* -------- LIKE -------- */

window.like=async function(id,count,user){

await updateDoc(doc(db,"posts",id),{like:count+1});

if(user!=username){

addNotification(user+" поставил лайк вашему посту");

}

}

/* -------- DELETE -------- */

window.delPost=async function(id){

await deleteDoc(doc(db,"posts",id));

}

/* -------- PROFILE -------- */

window.openProfile=async function(user){

document.getElementById("profileDiv").style.display="block";

document.getElementById("profileNick").innerText=user;

}

window.closeProfile=function(){

document.getElementById("profileDiv").style.display="none";

}

</script>

</body>
</html>
