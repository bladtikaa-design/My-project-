<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>

body{
font-family:sans-serif;
background:black;
color:white;
margin:0;
text-align:center;
}

#animatedText{
font-size:26px;
font-weight:bold;
color:#00ff00;
animation:glow 2s infinite alternate;
margin:10px;
}

@keyframes glow{
0%{color:#00ff00;}
50%{color:#55ff55;}
100%{color:#007700;}
}

#top{
background:#111;
padding:10px;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
object-fit:cover;
cursor:pointer;
}

.post{
background:#111;
margin:10px auto;
padding:10px;
border-radius:10px;
max-width:400px;
}

.postimg{
max-width:100%;
border-radius:10px;
margin-top:5px;
}

button{
padding:6px 12px;
border-radius:20px;
border:none;
cursor:pointer;
}

#profileButton{
position:fixed;
bottom:20px;
right:20px;
background:#222;
color:white;
border-radius:40px;
padding:10px 15px;
display:flex;
align-items:center;
gap:10px;
cursor:pointer;
}

#profileButton img{
width:40px;
height:40px;
border-radius:50%;
}

#profileDiv{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:white;
display:none;
z-index:5000;
padding:20px;
}

#closeProfile{
position:absolute;
top:20px;
right:20px;
font-size:30px;
cursor:pointer;
}

#profileTop{
display:flex;
align-items:center;
gap:15px;
}

#profileAvatar{
width:90px;
height:90px;
border-radius:50%;
}

#profileNick{
font-size:28px;
font-weight:bold;
}

#subs{
opacity:0.7;
}

#subscribeBtn{
margin-left:auto;
background:white;
color:black;
padding:10px 20px;
border-radius:30px;
}

#profilePosts{
margin-top:40px;
display:flex;
flex-direction:column;
gap:20px;
}

.profilePost{
height:120px;
border:2px solid white;
border-radius:20px;
}

</style>

</head>

<body>

<div id="animatedText">BLADTIK SITE OFFICIAL</div>

<div id="login">

<h2>Nickname</h2>

<input id="nickname"><br><br>

<input type="file" id="avatarInput"><br><br>

<button onclick="login()">Enter</button>

</div>

<div id="app" style="display:none">

<div id="top">

<img id="myavatar" class="avatar">

<b id="user"></b>

</div>

<br>

<input id="text" placeholder="Write post"><br><br>

<input type="file" id="photo"><br><br>

<button onclick="post()">Post</button>

<div id="posts"></div>

</div>

<div id="profileButton">

<img id="profileBtnImg">

<span>My Profile</span>

</div>

<div id="profileDiv">

<div id="closeProfile" onclick="closeProfile()">✖</div>

<div id="profileTop">

<img id="profileAvatar">

<div>

<div id="profileNick">Nick</div>

<div id="subs">Subscribers: <span id="subsCount">0</span></div>

</div>

<button id="subscribeBtn">Subscribe</button>

</div>

<div id="profilePosts">

<div class="profilePost"></div>
<div class="profilePost"></div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let username=localStorage.getItem("username");
let avatar=localStorage.getItem("avatar");
let activeProfile="";

window.login=function(){

username=document.getElementById("nickname").value;

let file=document.getElementById("avatarInput").files[0];

let reader=new FileReader();

reader.onload=function(){

avatar=reader.result;

localStorage.setItem("username",username);
localStorage.setItem("avatar",avatar);

afterLogin();

}

reader.readAsDataURL(file);

}

function afterLogin(){

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("user").innerText=username;
document.getElementById("myavatar").src=avatar;
document.getElementById("profileBtnImg").src=avatar;

startRealtime();

}

if(username && avatar){
afterLogin();
}

function startRealtime(){

onSnapshot(collection(db,"posts"),(snapshot)=>{

document.getElementById("posts").innerHTML="";

snapshot.forEach((docSnap)=>{

let data=docSnap.data();

let div=document.createElement("div");
div.className="post";

let img=data.photo?`<img class='postimg' src='${data.photo}'>`:"";

div.innerHTML=`
<img class='avatar' src='${data.avatar}' onclick='openProfile("${data.user}","${data.avatar}")'>
<b>${data.user}</b>
<br>
${data.text}
<br>
${img}
<br>
<button onclick='like("${docSnap.id}",${data.like})'>👍 ${data.like}</button>
`;

document.getElementById("posts").prepend(div);

});

});

}

window.post=async function(){

let text=document.getElementById("text").value;

await addDoc(collection(db,"posts"),{
user:username,
avatar:avatar,
text:text,
like:0
});

}

window.like=async function(id,count){

await updateDoc(doc(db,"posts",id),{
like:count+1
});

}

window.openProfile=async function(user,av){

activeProfile=user;

document.getElementById("profileDiv").style.display="block";
document.getElementById("profileNick").innerText=user;
document.getElementById("profileAvatar").src=av;

const subsSnap=await getDocs(collection(db,"subs"));

let count=0;

subsSnap.forEach(s=>{
if(s.data().to===user) count++;
});

document.getElementById("subsCount").innerText=count;

}

window.closeProfile=function(){

document.getElementById("profileDiv").style.display="none";

}

document.getElementById("subscribeBtn").onclick=async()=>{

await addDoc(collection(db,"subs"),{
from:username,
to:activeProfile
});

}

document.getElementById("profileButton").onclick=()=>{

openProfile(username,avatar);

}

</script>

</body>
</html>
