<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#f0f0f0;
color:black;
text-align:center;
}

.dark{
background:#000;
color:white;
}

/* космос фон */

#stars{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
overflow:hidden;
}

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:starMove linear infinite;
}

@keyframes starMove{
from{transform:translateY(-10px)}
to{transform:translateY(100vh)}
}

/* верх */

#top{
background:white;
padding:10px;
}

.dark #top{
background:#111;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
cursor:pointer;
}

.post{
background:white;
margin:10px auto;
padding:10px;
border-radius:10px;
max-width:400px;
}

.dark .post{
background:#111;
}

.postimg{
max-width:100%;
border-radius:10px;
}

/* профиль */

#profile{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:white;
display:none;
padding:30px;
}

#close{
position:absolute;
right:30px;
top:20px;
font-size:30px;
cursor:pointer;
}

#topProfile{
display:flex;
align-items:center;
gap:20px;
}

#avatar{
width:100px;
height:100px;
border-radius:50%;
border:3px solid white;
}

#nick{
font-size:35px;
font-weight:bold;
}

#subs{
opacity:0.7;
}

/* кнопка subscribe */

#subscribe{
margin-left:auto;
border:none;
border-radius:40px;
padding:12px 25px;
font-size:18px;
cursor:pointer;
color:white;
background:black;
border:2px solid white;
position:relative;
overflow:hidden;
}

#subStars{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

.subStar{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:subMove linear infinite;
}

@keyframes subMove{
from{transform:translateY(-5px)}
to{transform:translateY(40px)}
}

#dm{
margin-left:10px;
background:#222;
color:white;
border:none;
border-radius:40px;
padding:12px 20px;
cursor:pointer;
}

</style>
</head>

<body>

<div id="stars"></div>

<div id="top">

<img id="myavatar" class="avatar">

<b id="user"></b>

<button onclick="theme()">🌙</button>

</div>

<br>

<input id="text" placeholder="Write post"><br><br>

<input type="file" id="photo"><br><br>

<button onclick="post()">Post</button>

<div id="posts"></div>

<!-- профиль -->

<div id="profile">

<div id="close" onclick="closeProfile()">✖</div>

<div id="topProfile">

<img id="avatar">

<div>

<div id="nick"></div>

<div id="subs">Subscribers: <span id="subCount">0</span></div>

</div>

<button id="subscribe">

Subscribe

<div id="subStars"></div>

</button>

<button id="dm">💬 DM MESSAGE</button>

</div>

<div id="profilePosts"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* космос фон */

for(let i=0;i<120;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";

star.style.animationDuration=(3+Math.random()*5)+"s";

document.getElementById("stars").appendChild(star);

}

/* звезды в кнопке */

for(let i=0;i<20;i++){

let s=document.createElement("div");

s.className="subStar";

s.style.left=Math.random()*100+"%";

s.style.animationDuration=(2+Math.random()*3)+"s";

document.getElementById("subStars").appendChild(s);

}

/* тема */

window.theme=function(){

document.body.classList.toggle("dark");

}

/* посты */

onSnapshot(collection(db,"posts"),snap=>{

document.getElementById("posts").innerHTML="";

snap.forEach(doc=>{

let d=doc.data();

let div=document.createElement("div");

div.className="post";

div.innerHTML=`
<b onclick='openProfile("${d.user}","${d.avatar}")'>${d.user}</b>
<br>
${d.text}
`;

document.getElementById("posts").prepend(div);

});

});

/* пост */

window.post=async function(){

let text=document.getElementById("text").value;

await addDoc(collection(db,"posts"),{
user:"User1",
text:text
});

}

/* профиль */

let openUser="";

window.openProfile=async function(user,av){

openUser=user;

document.getElementById("profile").style.display="block";

document.getElementById("nick").innerText=user;

loadSubs(user);

}

/* закрыть */

window.closeProfile=function(){

document.getElementById("profile").style.display="none";

}

/* подписчики */

async function loadSubs(user){

let count=0;

let snap=await getDocs(collection(db,"subs"));

snap.forEach(doc=>{

if(doc.data().to==user) count++;

});

document.getElementById("subCount").innerText=count;

}

/* подписка */

document.getElementById("subscribe").onclick=async()=>{

let q=query(
collection(db,"subs"),
where("from","==","User1"),
where("to","==",openUser)
);

let s=await getDocs(q);

if(!s.empty){

alert("Already subscribed");

return;

}

await addDoc(collection(db,"subs"),{
from:"User1",
to:openUser
});

loadSubs(openUser);

}

</script>

</body>
</html>
