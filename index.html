<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#f0f0f0;
text-align:center;
color:black;
}

.dark{
background:#000;
color:white;
}

/* BLADTIK текст */

#animatedText{
font-size:26px;
font-weight:bold;
color:#00ff00;
margin:10px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
0%{color:#00ff00;}
50%{color:#55ff55;}
100%{color:#007700;}
}

/* космос */

#stars{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:starMove linear infinite;
}

@keyframes starMove{
from{transform:translateY(-10px)}
to{transform:translateY(100vh)}
}

/* верх */

#top{
background:white;
padding:10px;
}

.dark #top{
background:#111;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
cursor:pointer;
}

.post{
background:white;
margin:10px auto;
padding:10px;
border-radius:10px;
max-width:400px;
}

.dark .post{
background:#111;
}

.postimg{
max-width:100%;
border-radius:10px;
}

/* Liquid Glass кнопка */

#profileButton{
position:fixed;
bottom:20px;
right:20px;
height:60px;
width:190px;
border-radius:50px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
border:2px solid rgba(255,255,255,0.3);
display:flex;
align-items:center;
gap:10px;
padding-left:10px;
cursor:pointer;
}

#profileButton img{
width:45px;
height:45px;
border-radius:50%;
}

/* профиль */

#profile{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:white;
display:none;
padding:30px;
}

#close{
position:absolute;
right:30px;
top:20px;
font-size:30px;
cursor:pointer;
}

#topProfile{
display:flex;
align-items:center;
gap:20px;
}

#avatar{
width:100px;
height:100px;
border-radius:50%;
border:3px solid white;
}

#nick{
font-size:35px;
font-weight:bold;
}

#subs{
opacity:0.7;
}

#subscribe{
margin-left:auto;
border:none;
border-radius:40px;
padding:12px 25px;
font-size:18px;
cursor:pointer;
color:white;
background:black;
border:2px solid white;
position:relative;
overflow:hidden;
}

#dm{
margin-left:10px;
background:#222;
color:white;
border:none;
border-radius:40px;
padding:12px 20px;
cursor:pointer;
}

</style>
</head>

<body>

<div id="stars"></div>

<div id="animatedText">BLADTIK SITE OFFICIAL</div>

<div id="top">

<img id="myavatar" class="avatar">

<b id="user"></b>

<button onclick="theme()">🌙</button>

</div>

<br>

<input id="text" placeholder="Write post"><br><br>

<input type="file" id="photo"><br><br>

<button onclick="post()">Post</button>

<div id="posts"></div>

<div id="profileButton">

<img id="profileBtnImg">

<span>MY PROFILE</span>

</div>

<div id="profile">

<div id="close" onclick="closeProfile()">✖</div>

<div id="topProfile">

<img id="avatar">

<div>

<div id="nick"></div>

<div id="subs">Subscribers: <span id="subCount">0</span></div>

</div>

<button id="subscribe">Subscribe</button>

<button id="dm">💬 DM MESSAGE</button>

</div>

<div id="profilePosts"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* космос */

for(let i=0;i<120;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";

star.style.animationDuration=(3+Math.random()*5)+"s";

document.getElementById("stars").appendChild(star);

}

/* логин сохраненный */

let username=localStorage.getItem("username");
let avatar=localStorage.getItem("avatar");

if(username){

document.getElementById("user").innerText=username;
document.getElementById("myavatar").src=avatar;
document.getElementById("profileBtnImg").src=avatar;

}

/* тема */

window.theme=function(){

document.body.classList.toggle("dark");

}

/* посты */

onSnapshot(collection(db,"posts"),snap=>{

document.getElementById("posts").innerHTML="";

snap.forEach(doc=>{

let d=doc.data();

let div=document.createElement("div");

div.className="post";

let img=d.photo?`<img class='postimg' src='${d.photo}'>`:"";

div.innerHTML=`
<b>${d.user}</b>
<br>
${d.text}
<br>
${img}
`;

document.getElementById("posts").prepend(div);

});

});

/* пост */

window.post=async function(){

let text=document.getElementById("text").value;

let file=document.getElementById("photo").files[0];

let reader=new FileReader();

reader.onload=async function(){

await addDoc(collection(db,"posts"),{
user:username,
avatar:avatar,
text:text,
photo:reader.result
});

}

if(file) reader.readAsDataURL(file);

}

document.getElementById("profileButton").onclick=()=>{

document.getElementById("profile").style.display="block";

document.getElementById("nick").innerText=username;

document.getElementById("avatar").src=avatar;

}

window.closeProfile=function(){

document.getElementById("profile").style.display="none";

}

</script>

</body>
</html>
