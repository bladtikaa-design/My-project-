<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>
body{margin:0;font-family:sans-serif;text-align:center;background:#f0f0f0;}
.dark{background:#000;color:white;}

#animatedText{
font-size:28px;font-weight:bold;color:#00ff00;
animation:glow 2s infinite alternate;
}

@keyframes glow{
0%{color:#00ff00;}
50%{color:#55ff55;}
100%{color:#007700;}
}

/* NFT анимация */
@keyframes bearMove{
0%{transform:translateY(0)}
50%{transform:translateY(-6px)}
100%{transform:translateY(0)}
}
.nftBear{
font-size:40px;
animation:bearMove 1s infinite;
}

/* liquid glass кнопки */
.glass{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
border-radius:20px;
cursor:pointer;
}

/* 🎁 кнопка */
#giftButton{
position:fixed;
bottom:90px;
right:20px;
width:60px;
height:60px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
}

/* профиль кнопка */
#profileButton{
position:fixed;
bottom:20px;
right:20px;
width:200px;
height:60px;
display:flex;
align-items:center;
gap:10px;
padding-left:10px;
}
#profileButton img{
width:45px;height:45px;border-radius:50%;
}

/* пост */
.post{
background:white;
max-width:400px;
margin:10px auto;
padding:10px;
border-radius:12px;
}
.dark .post{background:#111;}

.avatar{width:40px;height:40px;border-radius:50%;}
.postimg{max-width:100%;border-radius:10px;}

</style>
</head>

<body>

<div id="animatedText">BLADTIK SITE OFFICIAL</div>

<div id="login">
<input id="nickname" placeholder="Nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">
<img id="myavatar" class="avatar">
<b id="user"></b>
<button onclick="theme()">🌙</button>

<br><br>

<input id="text" placeholder="Write post"><br><br>
<input type="file" id="photo"><br><br>
<button onclick="post()">Post</button>

<div id="posts"></div>
</div>

<!-- 🎁 кнопка -->
<div id="giftButton" class="glass" onclick="openGift()">🎁</div>

<!-- профиль -->
<div id="profileButton" class="glass">
<img id="profileBtnImg">
<span>MY PROFILE</span>
</div>

<div id="profile" style="display:none;background:black;color:white;position:fixed;top:0;left:0;width:100%;height:100%;">
<button onclick="closeProfile()">X</button>
<img id="avatar" style="width:100px;border-radius:50%">
<h2 id="nick"></h2>

<div id="profilePosts"></div>
</div>

<!-- 🎁 магазин -->
<div id="giftBox" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:black;color:white;padding:20px;border-radius:20px;">
<h2>🎁 NFT SHOP</h2>
<div id="balanceText"></div>

<br>

<div onclick="buyBear()" style="font-size:40px;cursor:pointer;">🧸</div>
<div>Animated NFT Bear - 100⚡</div>

<br>
<button onclick="closeGift()">Close</button>
</div>

<script>
let username=localStorage.getItem("username");
let avatar=localStorage.getItem("avatar");

let balance=parseInt(localStorage.getItem("balance"))||100;
let hasBear=localStorage.getItem("bear")==="true";

if(username) start();

function login(){
username=document.getElementById("nickname").value;
let file=document.getElementById("avatarInput").files[0];
let r=new FileReader();
r.onload=()=>{
avatar=r.result;
localStorage.setItem("username",username);
localStorage.setItem("avatar",avatar);
start();
}
r.readAsDataURL(file);
}

function start(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("user").innerText=username;
document.getElementById("myavatar").src=avatar;
document.getElementById("profileBtnImg").src=avatar;
}

function theme(){
document.body.classList.toggle("dark");
}

/* пост */
function post(){
let text=document.getElementById("text").value;
let div=document.createElement("div");
div.className="post";
div.innerHTML=`
<img class="avatar" src="${avatar}">
<b>${username}</b><br>${text}
`;
document.getElementById("posts").append(div);
}

/* 🎁 открыть */
function openGift(){
document.getElementById("giftBox").style.display="block";
document.getElementById("balanceText").innerText="Balance: "+balance+"⚡";
}

function closeGift(){
document.getElementById("giftBox").style.display="none";
}

/* покупка */
function buyBear(){
if(hasBear){
alert("Already have 🧸");
return;
}
if(balance<100){
alert("Not enough ⚡");
return;
}

balance-=100;
hasBear=true;

localStorage.setItem("balance",balance);
localStorage.setItem("bear","true");

alert("You buy 🧸");
closeGift();
}

/* профиль */
document.getElementById("profileButton").onclick=()=>{
openProfile(username,avatar);
}

function openProfile(user,av){
document.getElementById("profile").style.display="block";
document.getElementById("nick").innerText=user;
document.getElementById("avatar").src=av;

document.getElementById("profilePosts").innerHTML="";

/* NFT */
if(localStorage.getItem("bear")==="true"){
let nft=document.createElement("div");
nft.className="nftBear";
nft.innerText="NFT 🧸";
document.getElementById("profilePosts").append(nft);
}
}

function closeProfile(){
document.getElementById("profile").style.display="none";
}

</script>

</body>
</html>
