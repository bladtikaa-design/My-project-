<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>
body{
margin:0;
font-family:sans-serif;
text-align:center;
background:#f0f0f0;
}
.dark{
background:#000;
color:white;
}
#animatedText{
font-size:28px;
font-weight:bold;
color:#00ff00;
animation:glow 2s infinite alternate;
}
@keyframes glow{
0%{color:#00ff00;}
50%{color:#55ff55;}
100%{color:#007700;}
}
/* 💎 таймер */
#cooldownTimer{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
padding:12px 25px;
border-radius:30px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
color:#00ffcc;
font-weight:bold;
display:none;
z-index:999;
}
/* 🔥 hashtags */
#hashtagsBox{
position:fixed;
top:100px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
color:white;
padding:20px;
border-radius:15px;
backdrop-filter:blur(10px);
max-width:300px;
display:none;
}
#closeTags{
position:absolute;
top:8px;
right:12px;
cursor:pointer;
font-size:18px;
}
#tagsContent{
margin-top:10px;
}
/* космос */
#stars{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}
.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:move 8s linear infinite;
}
@keyframes move{
from{transform:translateY(-10px)}
to{transform:translateY(100vh)}
}
/* пост */
.post{
background:white;
max-width:400px;
margin:10px auto;
padding:10px;
border-radius:12px;
position:relative;
}
.dark .post{
background:#111;
}
.avatar{
width:40px;
height:40px;
border-radius:50%;
cursor:pointer;
}
.postimg{
max-width:100%;
border-radius:10px;
margin-top:5px;
}
/* лайк */
.like{
border:none;
padding:6px 12px;
border-radius:10px;
cursor:pointer;
}
/* удалить */
.deleteBtn{
position:absolute;
top:8px;
right:8px;
background:red;
color:white;
border:none;
border-radius:10px;
padding:5px 8px;
cursor:pointer;
font-size:16px;
}
/* кнопки */
.mainBtn{
border:none;
padding:10px 15px;
border-radius:20px;
cursor:pointer;
margin:5px;
}
/* liquid glass */
#profileButton{
position:fixed;
bottom:20px;
right:20px;
width:200px;
height:60px;
border-radius:40px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
display:flex;
align-items:center;
gap:10px;
padding-left:10px;
cursor:pointer;
}
#profileButton img{
width:45px;
height:45px;
border-radius:50%;
}
/* профиль */
#profile{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:white;
display:none;
padding:20px;
overflow:auto;
}
#close{
position:absolute;
top:20px;
right:20px;
font-size:30px;
cursor:pointer;
}
#avatar{
width:100px;
height:100px;
border-radius:50%;
border:3px solid white;
}
#subscribe,#dm{
border:none;
padding:10px 15px;
border-radius:20px;
margin:5px;
cursor:pointer;
}
/* чат */
#chat{
position:fixed;
bottom:0;
right:0;
width:300px;
height:350px;
background:white;
display:none;
flex-direction:column;
}
#messages{
flex:1;
overflow:auto;
color:black;
}

/* 🌀 екран завантаження */
#loadingScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

#loaderDots{
  display:flex;
  gap:15px;
  margin-bottom:20px;
}

.dot{
  width:15px;
  height:15px;
  background:white;
  border-radius:50%;
  animation:dotMove 1.5s infinite ease-in-out;
}

.dot:nth-child(2){ animation-delay:0.3s; }
.dot:nth-child(3){ animation-delay:0.6s; }

@keyframes dotMove{
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

#loadingText{
  font-size:20px;
  font-weight:bold;
  color:#fff;
}

/* 🔒 PASSWORD PANEL */
#passwordPanel{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:2000;
}
#passwordCircles{
display:flex;
gap:20px;
margin-bottom:30px;
}
.circle{
width:20px;
height:20px;
border-radius:50%;
background:rgba(255,255,255,0.3);
backdrop-filter:blur(8px);
transition: all 0.2s ease;
}
.circle.filled{
background:white;
transform: scale(1.3);
}
/* number pad */
#numPad{
display:grid;
grid-template-columns:repeat(3,80px);
grid-gap:15px;
}
.numBtn{
width:80px;
height:80px;
border-radius:50%;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
color:white;
cursor:pointer;
transition: transform 0.2s ease;
}
.numBtn:active{
transform: scale(1.3);
}
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loadingScreen">
  <div id="loaderDots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div id="loadingText">Loading... wait 5 seconds</div>
</div>

<!-- Password panel -->
<div id="passwordPanel">
  <div id="passwordCircles">
    <div class="circle" id="c1"></div>
    <div class="circle" id="c2"></div>
    <div class="circle" id="c3"></div>
    <div class="circle" id="c4"></div>
  </div>
  <div id="numPad"></div>
</div>

<div id="stars"></div>

<div id="animatedText">BLADTIK SITE OFFICIAL</div>
<div id="cooldownTimer"></div>

<!-- login -->
<div id="login">
<input id="nickname" placeholder="Nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">
<div>
<img id="myavatar" class="avatar">
<b id="user"></b>
<button onclick="theme()">🌙</button>
</div>

<br>
<input id="text" placeholder="Write post"><br><br>
<input type="file" id="photo"><br><br>

<button class="mainBtn" onclick="post()">Post</button>
<button class="mainBtn" onclick="showHashtags()">🔥 Popular #</button>
<div id="posts"></div>
</div>

<!-- profile button -->
<div id="profileButton">
<img id="profileBtnImg">
<span>MY PROFILE</span>
<button onclick="editAvatar()" style="margin-left:10px;padding:5px 10px;border-radius:12px;cursor:pointer;">Edit My Avatar</button>
</div>

<div id="profile">
<div id="close" onclick="closeProfile()">✖</div>
<img id="avatar">
<h2 id="nick"></h2>
<div>Subscribers: <span id="subs">0</span></div>
<button id="subscribe">Subscribe</button>
<button id="dm">💬 DM MESSAGE</button>
<div id="profilePosts"></div>
</div>

<div id="chat">
<div id="messages"></div>
<input id="msg">
<button onclick="sendMsg()">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* 🌌 Stars */
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
document.getElementById("stars").appendChild(s);
}

/* ⚡ User data */
let username=localStorage.getItem("username");
let avatar=localStorage.getItem("avatar");
let lastAvatarChange = localStorage.getItem("lastAvatarChange");

/* PASSWORD DATA */
let password = localStorage.getItem("password") || "";
let inputPass = "";

if(username && password){
  showPasswordPanel(false);
} else if(username && !password){
  showPasswordPanel(true);
}

window.login=function(){
username=document.getElementById("nickname").value;
let file=document.getElementById("avatarInput").files[0];
let reader=new FileReader();
reader.onload=function(){
avatar=reader.result;
localStorage.setItem("username",username);
start();
}
reader.readAsDataURL(file);
}

/* show main app */
function start(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("user").innerText=username;
document.getElementById("myavatar").src=avatar;
document.getElementById("profileBtnImg").src=avatar;
}

/* password panel */
function showPasswordPanel(isNew){
document.getElementById("passwordPanel").style.display="flex";
let pad = document.getElementById("numPad");
pad.innerHTML="";
for(let i=1;i<=9;i++){
  let btn = document.createElement("div");
  btn.className="numBtn";
  btn.innerText=i;
  btn.onclick=()=>handlePassInput(i);
  pad.appendChild(btn);
}
if(!isNew){
  let zero = document.createElement("div");
  zero.className="numBtn";
  zero.innerText="0";
  zero.onclick=()=>handlePassInput(0);
  pad.appendChild(zero);
}
}
function handlePassInput(num){
if(inputPass.length>=4) return;
inputPass+=num;
document.getElementById("c"+inputPass.length).classList.add("filled");
if(inputPass.length===4){
  if(!password){
    password=inputPass;
    localStorage.setItem("password",password);
    alert("Password saved!");
    document.getElementById("passwordPanel").style.display="none";
    start();
  } else {
    if(inputPass===password){
      document.getElementById("passwordPanel").style.display="none";
      start();
    } else {
      alert("Wrong password!");
      inputPass="";
      for(let i=1;i<=4;i++){
        document.getElementById("c"+i).classList.remove("filled");
      }
    }
  }
}
}

/* THE REST OF YOUR ORIGINAL CODE REMAINS HERE (posts, hashtags, chat, avatar, etc.) */

// ... оригинальный код с posts, likes, hashtags, chat, profile, editAvatar и т.д.

</script>
</body>
</html>
