<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>

/* ТВОЙ CSS БЕЗ ИЗМЕНЕНИЙ */
body{margin:0;font-family:sans-serif;text-align:center;background:#f0f0f0;}
.dark{background:#000;color:white;}

#chat{
position:fixed;
bottom:0;
right:0;
width:300px;
height:350px;
background:white;
display:none;
flex-direction:column;
}

#messages{flex:1;overflow:auto;color:black;}

</style>
</head>

<body>

<!-- ВСЁ ТВОЁ -->
<div id="stars"></div>
<div id="animatedText">BLADTIK SITE OFFICIAL</div>

<div id="login">
<input id="nickname" placeholder="Nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">
<b id="user"></b>
<div id="posts"></div>
</div>

<div id="profile">
<button id="inviteRoom">📞 Invite</button>
<button id="invitePublic">🌍 Public Room</button>
</div>

<!-- ЧАТ -->
<div id="chat">

<div id="roomId" style="background:black;color:white;padding:5px;"></div>

<div style="background:#111;color:white;padding:5px;">
<button id="closeRoom">❌ Close</button>
<button id="makePrivate">🔒 Private</button>
<button id="makePublic">🌍 Public</button>
</div>

<div id="messages"></div>
<input id="msg">
<button onclick="sendMsg()">Send</button>

</div>

<!-- POPUP -->
<div id="invitePopup" style="
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:black;
color:white;
padding:20px;
">
<div id="inviteText"></div>
<button id="acceptInvite" style="color:lime;">ACCEPT</button>
<button id="declineInvite" style="color:red;">DECLINE</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
});

const db=getFirestore(app);

let username="";
let currentRoom="";
let roomOwner="";
let roomType="private";

/* логин */
window.login=function(){
username=document.getElementById("nickname").value;
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("user").innerText=username;
}

/* ID */
function generateRoomId(){
let l="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let id="";
for(let i=0;i<4;i++){
id+=l[Math.floor(Math.random()*l.length)];
}
return id;
}

/* 📞 INVITE */
document.getElementById("inviteRoom").onclick=async()=>{
let room=generateRoomId();

await addDoc(collection(db,"invites"),{
from:username,
room:room,
type:"private"
});
}

/* 🌍 PUBLIC */
document.getElementById("invitePublic").onclick=async()=>{
let room=generateRoomId();

await addDoc(collection(db,"rooms"),{
id:room,
owner:username,
type:"public"
});

openRoom(room,username,"public");
}

/* 📥 LISTEN INVITE */
onSnapshot(collection(db,"invites"),snap=>{
snap.forEach(d=>{
let data=d.data();

if(data.from!=username){
document.getElementById("invitePopup").style.display="block";
document.getElementById("inviteText").innerText=data.from+" invites you";
window.inviteId=d.id;

currentRoom=data.room;
roomOwner=data.from;
roomType=data.type;
}
});
});

/* ACCEPT */
document.getElementById("acceptInvite").onclick=async()=>{
document.getElementById("invitePopup").style.display="none";
await deleteDoc(doc(db,"invites",window.inviteId));
openRoom(currentRoom,roomOwner,roomType);
}

/* DECLINE */
document.getElementById("declineInvite").onclick=async()=>{
document.getElementById("invitePopup").style.display="none";
await deleteDoc(doc(db,"invites",window.inviteId));
}

/* ОТКРЫТЬ */
function openRoom(room,owner,type){
currentRoom=room;
roomOwner=owner;
roomType=type;

document.getElementById("chat").style.display="flex";
document.getElementById("roomId").innerText="ROOM: "+room;
}

/* CLOSE */
document.getElementById("closeRoom").onclick=()=>{
if(username!=roomOwner) return alert("Not owner");
currentRoom="";
document.getElementById("chat").style.display="none";
}

/* PRIVATE */
document.getElementById("makePrivate").onclick=()=>{
if(username!=roomOwner) return;
roomType="private";
}

/* PUBLIC */
document.getElementById("makePublic").onclick=()=>{
if(username!=roomOwner) return;
roomType="public";
}

/* SEND */
window.sendMsg=async()=>{
let text=document.getElementById("msg").value;

await addDoc(collection(db,"messages"),{
room:currentRoom,
user:username,
text:text
});

document.getElementById("msg").value="";
}

/* LISTEN MSG */
onSnapshot(collection(db,"messages"),snap=>{
document.getElementById("messages").innerHTML="";

snap.forEach(d=>{
let data=d.data();

if(data.room==currentRoom){
let div=document.createElement("div");
div.innerText=data.user+": "+data.text;
document.getElementById("messages").append(div);
}
});
});

</script>

</body>
</html>
