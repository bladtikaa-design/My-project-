<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Social</title>
<style>
body{font-family:sans-serif;background:#f0f0f0;text-align:center;margin:0;}

/* ---------------- ANIMATED GREEN TEXT ---------------- */
#animatedText{
  font-size:32px;
  font-weight:bold;
  margin:10px 0;
  animation: greenGlow 2s infinite alternate;
}
@keyframes greenGlow{
  0% { color: #00ff00; }
  50% { color: #55ff55; }
  100% { color: #007700; }
}

/* ---------------- B🫵L TEXT ---------------- */
#blText{
  font-size:28px;
  font-weight:bold;
  color:#ffcc00;
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  cursor:default;
  animation: pulse 1.5s infinite alternate;
}
@keyframes pulse{
  0%{ transform:translateX(-50%) scale(1);}
  50%{ transform:translateX(-50%) scale(1.05);}
  100%{ transform:translateX(-50%) scale(1);}
}

/* ---------------- POSTS & APP ---------------- */
#top{background:white;padding:10px;}
.post{background:white;margin:10px auto;padding:10px;border-radius:10px;max-width:400px;position:relative;}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;}
.postimg{max-width:100%;border-radius:10px;margin-top:5px;}
.delete{position:absolute;top:5px;right:5px;border:none;background:red;color:white;border-radius:10px;cursor:pointer;}
.dark{background:#111;color:white;}
.dark .post{background:#1e1e1e;}
#dmMessages{height:120px;overflow-y:auto;background:#111;padding:5px;border-radius:5px;margin-bottom:5px;}
#callVideo{display:none;width:100%;margin-top:5px;border-radius:10px;}
#incomingCall{display:none;background:#333;color:white;padding:10px;border-radius:10px;margin-bottom:5px;}
#callUserBtn{padding:5px 8px;border:none;background:blue;color:white;border-radius:5px;cursor:pointer;margin-bottom:5px;}

/* ---------------- LOGIN ---------------- */
#login input, #login button{padding:5px; border-radius:5px; margin:5px;}

/* ---------------- LIQUID GLASS PROFILE BUTTON ---------------- */
#profileButton{
  position:fixed;
  bottom:20px;
  right:20px;
  height:60px;
  width:180px;
  border-radius:50px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255,255,255,0.3);
  display:flex;
  align-items:center;
  justify-content:flex-start;
  cursor:pointer;
  padding-left:10px;
  transition: all 0.3s ease;
}
#profileButton:hover{
  background: rgba(255,255,255,0.25);
  transform: scale(1.05);
}
#profileButton img{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,0.3);
  margin-right:10px;
  transition: all 0.3s ease;
}
#profileButton span{
  color:white;
  font-weight:bold;
  user-select:none;
}

/* ---------------- PROFILE MENU ---------------- */
#profileDiv{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background: rgba(0,0,0,0.6);
  padding:20px;
  border-radius:20px;
  z-index:1000;
  width:300px;
  backdrop-filter: blur(10px);
}
#closeProfile{
  margin-top:10px;
  padding:5px 10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
#subscribeBtn{
  padding:5px 10px;
  border:none;
  border-radius:30px;
  background: rgba(255,255,255,0.2);
  color:white;
  cursor:pointer;
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
}
#subscribeBtn:hover{
  background: rgba(255,255,255,0.3);
}

/* ---------------- VERIFIED ---------------- */
.verified {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px;
  height:18px;
  background:#1DA1F2; /* синий ромб */
  color:white;
  font-size:12px;
  font-weight:bold;
  border-radius:4px;
  margin-left:5px;
}
</style>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<div id="blText">B🫵L</div>

<div id="animatedText">BLADTIK SITE</div>

<div id="login">
<h2>Nickname</h2>
<input id="nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<div class="g-recaptcha" data-sitekey="6LfBxYQsAAAAAEdWSoTfDLNQw5VqQcexGKbzuDY3"></div><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">
<div id="top">
<img id="myavatar" class="avatar">
<b id="user"></b>
<button onclick="theme()">🌙</button>
</div>
<br>
<input id="text" placeholder="Write post"><br><br>
<input type="file" id="photo"><br><br>
<button onclick="post()">Post</button>
<div id="posts"></div>
</div>

<div id="profileDiv">
<b id="profileNick"></b><br>
Subscribers: <span id="subCount">0</span><br>
<button id="subscribeBtn">Subscribe</button><br><br>
<div id="dmMessages"></div>
<input id="dmInput" placeholder="Write..." style="width:70%;padding:5px;border-radius:5px;border:none;">
<button id="dmSend">➤</button><br><br>
<div id="incomingCall">
<b id="callerName"></b> is calling!<br>
<button id="acceptCallBtn">Accept</button>
<button id="rejectCallBtn">Reject</button>
</div>
<video id="callVideo" autoplay playsinline style="width:100%;margin-top:5px;border-radius:10px;"></video><br>
<button id="closeProfile">Close</button>
</div>

<div id="profileButton">
  <img id="profileBtnImg" src="">
  <span>My Profile</span>
</div>

<audio id="ringtone" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAE46eiz4XltTwoPz4mVFG6kvPqAIhVf10",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf",
storageBucket:"mysocial-dabdf.firebasestorage.app",
messagingSenderId:"812073291348",
appId:"1:812073291348:web:e68dbf6c412c72de5aa7c1",
measurementId:"G-24XWVXT1HV"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let username = localStorage.getItem("username");
let avatar = localStorage.getItem("avatar");
let messages = {};
let activeProfile = "";

// ---------------- LOGIN ----------------
window.login=function(){
  const response = grecaptcha.getResponse();
  if(response.length === 0){ return alert("Please verify captcha!"); }
  username=document.getElementById("nickname").value;
  if(!username) return alert("Enter nickname!");
  let file=document.getElementById("avatarInput").files[0];
  if(!file) return alert("Select avatar!");
  let reader=new FileReader();
  reader.onload=function(){ 
      avatar=reader.result; 
      localStorage.setItem("username",username); 
      localStorage.setItem("avatar",avatar); 
      afterLogin();
      grecaptcha.reset();
  }
  reader.readAsDataURL(file);
}

// ---------------- AFTER LOGIN ----------------
function afterLogin(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("user").innerText=username;
  document.getElementById("myavatar").src=avatar;
  document.getElementById("profileBtnImg").src = avatar;
  startRealtime();
}

// ---------------- VERIFIED ----------------
function isVerified(nick){ return nick === "G"; }
function getVerifiedHTML(nick){ return isVerified(nick) ? "<span class='verified'>✔</span>" : ""; }

// ---------------- POSTS ----------------
window.post=async function(){
  let text=document.getElementById("text").value;
  let photoFile=document.getElementById("photo").files[0]; 
  let photo="";
  if(photoFile){ 
      let reader=new FileReader(); 
      reader.onload=async function(){ 
          photo=reader.result; 
          await addDoc(collection(db,"posts"),{user:username,avatar:avatar,text:text,photo:photo,like:0}); 
      } 
      reader.readAsDataURL(photoFile); 
  } else{ 
      await addDoc(collection(db,"posts"),{user:username,avatar:avatar,text:text,photo:"",like:0}); 
  }
}

// ---------------- REALTIME POSTS ----------------
function startRealtime(){
  onSnapshot(collection(db,"posts"),(snapshot)=>{
      document.getElementById("posts").innerHTML="";
      snapshot.forEach(docSnap=>{
          const data = docSnap.data();
          const div = document.createElement("div");
          div.className="post";
          let img = data.photo ? `<img class='postimg' src='${data.photo}'>` : "";
          let del = (data.user===username) ? `<button class='delete' onclick='delPost("${docSnap.id}")'>🗑</button>` : "";
          div.innerHTML = del + `<img class='avatar' src='${data.avatar}' onclick='openProfile("${data.user}")'> 
            <b onclick='openProfile("${data.user}")'>${data.user}${getVerifiedHTML(data.user)}</b><br>
            ${data.text}<br>
            ${img}<br>
            <button onclick='like("${docSnap.id}",${data.like})'>👍 ${data.like}</button>`;
          document.getElementById("posts").prepend(div);
      });
  });
}

// ---------------- LIKES / DELETE / THEME ----------------
window.like=async function(id,count){ await updateDoc(doc(db,"posts",id),{like:count+1}); }
window.delPost=async function(id){ await deleteDoc(doc(db,"posts",id)); }
window.theme=function(){ document.body.classList.toggle("dark"); }

// ---------------- PROFILE BUTTON ----------------
document.getElementById("profileButton").onclick=()=>{ openProfile(username); };
document.getElementById("closeProfile").onclick=()=>{ document.getElementById("profileDiv").style.display="none"; };

// ---------------- OPEN PROFILE ----------------
window.openProfile = async function(user){
  activeProfile = user;
  document.getElementById("profileDiv").style.display="block";
  document.getElementById("profileNick").innerHTML = user + getVerifiedHTML(user);

  // Получаем количество подписчиков
  const subsSnap = await getDocs(query(collection(db,"subscriptions"),where("to","==",user)));
  document.getElementById("subCount").innerText = subsSnap.size;

  if(user===username){ 
      document.getElementById("subscribeBtn").style.display="none"; 
  } else {
      // Проверяем подписку текущего пользователя
      const mySubSnap = await getDocs(query(collection(db,"subscriptions"),
          where("to","==",user),
          where("from","==",username)
      ));
      document.getElementById("subscribeBtn").disabled = mySubSnap.size>0;
      document.getElementById("subscribeBtn").innerText = mySubSnap.size>0 ? "Subscribed" : "Subscribe";
      document.getElementById("subscribeBtn").style.display="inline-block";
  }
}

// ---------------- SUBSCRIBE ----------------
document.getElementById("subscribeBtn").onclick=async()=>{
  await addDoc(collection(db,"subscriptions"),{from:username,to:activeProfile});
  document.getElementById("subscribeBtn").disabled=true;
  document.getElementById("subscribeBtn").innerText="Subscribed";

  // Обновляем счетчик подписчиков
  const subsSnap = await getDocs(query(collection(db,"subscriptions"),where("to","==",activeProfile)));
  document.getElementById("subCount").innerText = subsSnap.size;
}
</script>
</body>
</html>
