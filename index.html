<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#f0f0f0;
text-align:center;
}

.dark{
background:#000;
color:white;
}

#animatedText{
font-size:26px;
font-weight:bold;
color:#00ff00;
margin:10px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
0%{color:#00ff00;}
50%{color:#55ff55;}
100%{color:#007700;}
}

/* космос */

#stars{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:move 6s linear infinite;
}

@keyframes move{
from{transform:translateY(-10px)}
to{transform:translateY(100vh)}
}

/* пост */

.post{
background:white;
margin:10px auto;
padding:10px;
border-radius:10px;
max-width:400px;
}

.dark .post{
background:#111;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
cursor:pointer;
}

.postimg{
max-width:100%;
border-radius:10px;
}

/* liquid glass */

#profileButton{
position:fixed;
bottom:20px;
right:20px;
height:60px;
width:200px;
border-radius:50px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
border:2px solid rgba(255,255,255,0.3);
display:flex;
align-items:center;
gap:10px;
padding-left:10px;
cursor:pointer;
}

#profileButton img{
width:45px;
height:45px;
border-radius:50%;
}

/* профиль */

#profile{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:white;
display:none;
padding:20px;
}

#close{
position:absolute;
right:20px;
top:20px;
font-size:30px;
cursor:pointer;
}

#topProfile{
display:flex;
align-items:center;
gap:20px;
}

#avatar{
width:100px;
height:100px;
border-radius:50%;
border:3px solid white;
}

#nick{
font-size:32px;
font-weight:bold;
}

#subscribe{
margin-left:auto;
border:none;
border-radius:40px;
padding:10px 20px;
background:white;
cursor:pointer;
}

#dm{
margin-left:10px;
border:none;
border-radius:40px;
padding:10px 20px;
background:#333;
color:white;
cursor:pointer;
}

/* чат */

#chat{
position:fixed;
bottom:0;
right:0;
width:300px;
height:400px;
background:white;
display:none;
flex-direction:column;
}

#messages{
flex:1;
overflow:auto;
}

</style>
</head>

<body>

<div id="stars"></div>

<div id="animatedText">BLADTIK SITE OFFICIAL</div>

<input id="nickname" placeholder="Nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<button onclick="login()">Enter</button>

<hr>

<input id="text" placeholder="Write post"><br><br>
<input type="file" id="photo"><br><br>
<button onclick="post()">Post</button>

<div id="posts"></div>

<div id="profileButton">
<img id="profileBtnImg">
<span>MY PROFILE</span>
</div>

<div id="profile">

<div id="close" onclick="closeProfile()">✖</div>

<div id="topProfile">

<img id="avatar">

<div>
<div id="nick"></div>
<div>Subscribers: <span id="subs">0</span></div>
</div>

<button id="subscribe">Subscribe</button>

<button id="dm">💬 DM</button>

</div>

<div id="profilePosts"></div>

</div>

<div id="chat">

<div id="messages"></div>

<input id="msg">
<button onclick="sendMsg()">Send</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* звезды */

for(let i=0;i<100;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";

document.getElementById("stars").appendChild(s);

}

let username="";
let avatar="";

/* логин */

window.login=function(){

username=document.getElementById("nickname").value;

let file=document.getElementById("avatarInput").files[0];

let reader=new FileReader();

reader.onload=function(){

avatar=reader.result;

localStorage.setItem("username",username);
localStorage.setItem("avatar",avatar);

document.getElementById("profileBtnImg").src=avatar;

}

reader.readAsDataURL(file);

}

/* пост */

window.post=function(){

let text=document.getElementById("text").value;

let file=document.getElementById("photo").files[0];

let reader=new FileReader();

reader.onload=async function(){

await addDoc(collection(db,"posts"),{
user:username,
avatar:avatar,
text:text,
photo:reader.result
});

}

if(file) reader.readAsDataURL(file);

}

/* загрузка постов */

onSnapshot(collection(db,"posts"),snap=>{

document.getElementById("posts").innerHTML="";

snap.forEach(doc=>{

let d=doc.data();

let div=document.createElement("div");

div.className="post";

div.innerHTML=`
<img class="avatar" src="${d.avatar}" onclick="openProfile('${d.user}','${d.avatar}')">
<b>${d.user}</b>
<br>
${d.text}
<br>
<img class="postimg" src="${d.photo}">
`;

document.getElementById("posts").prepend(div);

});

});

/* профиль */

window.openProfile=async function(user,av){

document.getElementById("profile").style.display="block";

document.getElementById("nick").innerText=user;

document.getElementById("avatar").src=av;

document.getElementById("profilePosts").innerHTML="";

let snap=await getDocs(collection(db,"posts"));

snap.forEach(doc=>{

let d=doc.data();

if(d.user==user){

let div=document.createElement("div");

div.className="post";

div.innerHTML=`${d.text}<br><img class="postimg" src="${d.photo}">`;

document.getElementById("profilePosts").append(div);

}

});

}

window.closeProfile=function(){

document.getElementById("profile").style.display="none";

}

/* DM */

document.getElementById("dm").onclick=function(){

document.getElementById("chat").style.display="flex";

}

</script>

</body>
</html>
