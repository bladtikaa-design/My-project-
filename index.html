<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BLADTIK SITE</title>

<style>
body{
margin:0;
font-family:sans-serif;
text-align:center;
background:#f0f0f0;
}
.dark{background:#000;color:white;}

#animatedText{
font-size:28px;
font-weight:bold;
color:#00ff00;
animation:glow 2s infinite alternate;
}
@keyframes glow{
0%{color:#00ff00;}
50%{color:#55ff55;}
100%{color:#007700;}
}

/* 📡 radar */
#radarBox{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
padding:15px 30px;
border-radius:30px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
color:#00ffcc;
font-weight:bold;
display:none;
z-index:9999;
}

/* чат */
#chat{
position:fixed;
bottom:0;
right:0;
width:300px;
height:350px;
background:white;
display:none;
flex-direction:column;
}
#messages{flex:1;overflow:auto;color:black;}

.mainBtn{
border:none;
padding:10px 15px;
border-radius:20px;
cursor:pointer;
margin:5px;
}
</style>
</head>

<body>

<div id="animatedText">BLADTIK SITE OFFICIAL</div>

<div id="radarBox">📡 Searching...</div>

<div id="login">
<input id="nickname" placeholder="Nickname"><br><br>
<input type="file" id="avatarInput"><br><br>
<button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">

<button onclick="enableMotion()" class="mainBtn">📳 Enable Shake</button>

<div>
<img id="myavatar" style="width:40px;border-radius:50%">
<b id="user"></b>
</div>

<br>

<input id="text" placeholder="Write post"><br><br>
<button onclick="post()">Post</button>

<div id="posts"></div>
</div>

<div id="chat">
<div id="messages"></div>
<input id="msg">
<button onclick="sendMsg()">Send</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAE46",
authDomain:"mysocial-dabdf.firebaseapp.com",
projectId:"mysocial-dabdf"
});
const db=getFirestore(app);

let username,avatar;

/* login */
window.login=function(){
username=document.getElementById("nickname").value;
let file=document.getElementById("avatarInput").files[0];
let r=new FileReader();
r.onload=()=>{
avatar=r.result;
localStorage.setItem("username",username);
localStorage.setItem("avatar",avatar);
start();
}
r.readAsDataURL(file);
}

function start(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("user").innerText=username;
document.getElementById("myavatar").src=avatar;
}

/* пост */
window.post=function(){
addDoc(collection(db,"posts"),{
user:username,
text:document.getElementById("text").value
});
}

/* 📳 iPhone разрешение */
window.enableMotion = async () => {
if (typeof DeviceMotionEvent !== "undefined" &&
    typeof DeviceMotionEvent.requestPermission === "function") {
    try {
        let res = await DeviceMotionEvent.requestPermission();
        if (res === "granted") {
            alert("Shake enabled ✅");
        }
    } catch(e){
        alert("Error");
    }
}
};

/* 📡 SHAKE DETECT */
let lastShake=0;
let connected=false;

window.addEventListener("devicemotion",(e)=>{
let acc=e.accelerationIncludingGravity;
if(!acc) return;

let power=Math.abs(acc.x)+Math.abs(acc.y)+Math.abs(acc.z);

if(power>25){
if(Date.now()-lastShake<3000) return;
lastShake=Date.now();
startRadar();
}
});

async function startRadar(){
if(connected) return;

let radar=document.getElementById("radarBox");
radar.style.display="block";
radar.innerText="📡 Searching...";

await addDoc(collection(db,"radar"),{
user:username,
time:Date.now()
});

onSnapshot(collection(db,"radar"),snap=>{
snap.forEach(docu=>{
let d=docu.data();

if(d.user!==username && Date.now()-d.time<5000 && !connected){

connected=true;

radar.innerText="✅ CONNECTED WITH "+d.user;

/* 💬 открыть чат */
document.getElementById("chat").style.display="flex";

/* сообщение в чат */
let div=document.createElement("div");
div.innerText="🔗 Connected with "+d.user;
document.getElementById("messages").append(div);

setTimeout(()=>{
radar.style.display="none";
connected=false;
},5000);

}
});
});
}

/* 💬 чат */
window.sendMsg=()=>{
let text=document.getElementById("msg").value;
let div=document.createElement("div");
div.innerText=username+": "+text;
document.getElementById("messages").append(div);
document.getElementById("msg").value="";
}

</script>

</body>
</html>
